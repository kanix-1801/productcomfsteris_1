<template>
	<template lwc:if={showCreateReturnOrder}>
		<div class="create-return-order-host">
			<c-create-return-order
				record-id={recordId}
				object-api-name="WorkOrder"
				embedded-mode={embedCreateReturnOrder}
				onexit={handleCreateReturnOrderExit}>
			</c-create-return-order>
		</div>
	</template>

	<!-- ── Offline banner (static at top) ─────────────────────────────── -->
	<template lwc:if={isOffline}>
		<div class="offline-banner">
			<lightning-icon icon-name="utility:offline" size="x-small"></lightning-icon>
			Offline — internet connection is required to save changes.
		</div>
	</template>

	<!-- ── Loading spinner ───────────────────────────────────────────── -->
	<template lwc:if={isLoading}>
		<div class="slds-align_absolute-center slds-p-around_large">
			<lightning-spinner alternative-text="Loading work order…" size="medium"></lightning-spinner>
		</div>
	</template>

	<!-- ── Wire error ────────────────────────────────────────────────── -->
	<template lwc:if={hasError}>
		<div class="slds-box slds-box_x-small slds-theme_error slds-m-around_small">
			<lightning-formatted-text value={errorMessage}></lightning-formatted-text>
		</div>
	</template>

	<!-- ── Main content ──────────────────────────────────────────────── -->
	<template lwc:if={showDebrief}>

		<!-- ── WO Header (single row: WO #, Status, Account, Asset, Order Type) ── -->
		<div class="wo-header">
			<div class="header-toolbar">
				<lightning-button
					label="+ Add Multiple Assets"
					variant="neutral"
					onclick={handleOpenMultiAssetPicker}>
				</lightning-button>
			</div>
			<div class="header-fields">
				<div class="header-field">
					<div class="field-label">WO #</div>
					<div class="field-value field-value_strong">{woNumber}</div>
				</div>
				<div class="header-field">
					<div class="field-label">Status</div>
					<span class="status-badge">{woStatus}</span>
				</div>
				<div class="header-field">
					<div class="field-label">Account</div>
					<div class="field-value">{woAccountName}</div>
				</div>
				<div class="header-field">
					<div class="field-label">Asset</div>
					<div class="field-value">{woAssetName}</div>
				</div>
				<div class="header-field">
					<div class="field-label">Order Type</div>
					<div class="field-value">{woType}</div>
				</div>
			</div>
			<div class="header-picture-action">
				<label class="mobile-picture-button" data-scope="header">
					<input
						type="file"
						accept="image/*"
						class="mobile-picture-input"
						data-scope="header"
						data-id={recordId}
						onchange={handleMobilePictureSelected} />
					Mobile Device Picture
				</label>
				<span class="picture-count">{headerPictureCountLabel}</span>
			</div>
			<template lwc:if={hasHeaderPictures}>
				<div class="picture-strip">
					<template for:each={headerPictures} for:item="picture">
						<div key={picture.key} class="picture-tile">
							<button
								type="button"
								class="picture-thumb-btn"
								data-key={picture.key}
								data-scope="header"
								data-line-id={recordId}
								onclick={handleReviewPicture}>
									<template lwc:if={picture.previewUrl}>
										<img
											class="picture-thumb"
											src={picture.previewUrl}
											alt="Mobile Device Picture"
											data-version-id={picture.contentVersionId}
											onerror={handlePicturePreviewError} />
									</template>
								</button>
							<lightning-button-icon
								class="picture-delete"
								icon-name="utility:delete"
								alternative-text="Delete picture"
								title="Delete picture"
								variant="border-filled"
								size="small"
								data-key={picture.key}
								data-scope="header"
								data-line-id={recordId}
								onclick={handleDeletePicture}>
							</lightning-button-icon>
							<template lwc:if={picture.hasComment}>
								<div class="picture-comment-caption" title={picture.comment}>{picture.commentPreview}</div>
							</template>
						</div>
					</template>
				</div>
			</template>
		</div>

		<!-- ── Custom tab bar (data-driven from TAB_DEFS) ────────────── -->
		<div class="tab-bar">
			<template for:each={tabs} for:item="tab">
				<button key={tab.key} class="tab-btn" data-tab={tab.key} onclick={handleTabSelect}>
					<span class="tab-label">{tab.label}</span>
					<template lwc:if={tab.isActive}><span class="tab-indicator"></span></template>
				</button>
			</template>
		</div>

		<!-- ── Inner-scroll region (lines + add form + save report) ── -->
		<div class="scrollable-content">

			<!-- ── Active tab panel ──────────────────────────────────────── -->
			<template lwc:if={activeTabModel}>
				<div class="tab-panel slds-p-around_x-small">

					<!-- ── Return Orders (read-only list, detail, Create Return Order) ── -->
					<template lwc:if={isActiveTabReturnOrders}>
						<template lwc:if={showReturnOrderDetail}>
							<div class="return-order-detail">
								<button type="button" class="return-order-back" onclick={handleReturnOrderDetailClose}>
									Return Orders
								</button>
								<div class="return-order-fields slds-m-bottom_small">
									<div class="return-order-field">
										<div class="field-label">Return Order Number</div>
										<div class="field-value field-value_strong">{selectedReturnOrder.returnOrderNumber}</div>
									</div>
									<div class="return-order-field">
										<div class="field-label">Status</div>
										<div class="field-value">{selectedReturnOrder.status}</div>
									</div>
									<div class="return-order-field">
										<div class="field-label">Repair Center</div>
										<div class="field-value">{selectedReturnOrder.repairCenterName}</div>
									</div>
								</div>
								<template lwc:if={selectedReturnOrder.hasLineItems}>
									<div class="return-order-table-wrap">
										<table class="slds-table slds-table_cell-buffer slds-table_bordered">
											<thead>
												<tr class="slds-line-height_reset">
													<th scope="col">Item Description</th>
													<th scope="col">Product Line</th>
													<th scope="col">Model</th>
													<th scope="col">Department</th>
													<th scope="col">Serial</th>
												</tr>
											</thead>
											<tbody>
												<template for:each={selectedReturnOrder.lineItems} for:item="item">
													<tr key={item.id}>
														<td>{item.itemDescription}</td>
														<td>{item.productLine}</td>
														<td>{item.model}</td>
														<td>{item.departmentName}</td>
														<td>{item.serialNumber}</td>
													</tr>
												</template>
											</tbody>
										</table>
									</div>
								</template>
								<template lwc:else>
									<p class="no-search-results">No line items.</p>
								</template>
							</div>
						</template>
						<template lwc:else>
							<template lwc:if={canCreateReturnOrder}>
								<div class="add-btn-wrapper slds-m-bottom_small">
									<lightning-button
										label="Create Return Order"
										variant="brand"
										onclick={handleCreateReturnOrder}
										class="slds-size_1-of-1">
									</lightning-button>
								</div>
							</template>
							<template lwc:if={hasNoReturnOrders}>
								<p class="no-search-results">No return orders.</p>
							</template>
							<template for:each={activeTabModel.lines} for:item="order">
								<div key={order.Id} class="slds-m-bottom_x-small">
									<div
										class={order.cardClass}
										data-id={order.Id}
										role="button"
										tabindex="0"
										onclick={handleReturnOrderSelect}
										onkeydown={handleReturnOrderSelect}>
										<div class="return-order-card">
											<div class="return-order-fields">
												<div class="return-order-field">
													<div class="field-label">Return Order Number</div>
													<div class="field-value field-value_strong">{order.returnOrderNumber}</div>
												</div>
												<div class="return-order-field">
													<div class="field-label">Status</div>
													<div class="field-value">{order.status}</div>
												</div>
												<div class="return-order-field">
													<div class="field-label">Repair Center</div>
													<div class="field-value">{order.repairCenterName}</div>
												</div>
											</div>
											<lightning-icon
												icon-name="utility:chevronright"
												size="x-small"
												class="return-order-chevron">
											</lightning-icon>
										</div>
									</div>
								</div>
							</template>
						</template>
					</template>
					<template lwc:else>

					<template lwc:if={showProductServicedMultiAsset}>
						<div class="add-form-wrapper">
							<template lwc:if={multiAssetLoading}>
								<div class="slds-align_absolute-center slds-p-around_medium">
									<lightning-spinner alternative-text="Loading assets…" size="small"></lightning-spinner>
								</div>
							</template>
							<template lwc:elseif={multiAssetStatusMessage}>
								<p class="multi-asset-status">{multiAssetStatusMessage}</p>
							</template>
							<template lwc:else>
								<p class="multi-asset-intro">Select one or more IMS Assets to link to this Work Order. Assets with no last serviced date, then the oldest date, are listed first. IMS Assets that already have a Work Order Line Item on this Work Order are not shown.</p>
								<div class="asset-filter-grid">
									<lightning-combobox
										label="Product Line"
										value={assetFilters.productLine}
										options={productLineFilterOptions}
										data-field="productLine"
										onchange={handleAssetFilterChange}>
									</lightning-combobox>
									<lightning-combobox
										label="Sub Product Line"
										value={assetFilters.subProductLine}
										options={subProductLineFilterOptions}
										data-field="subProductLine"
										onchange={handleAssetFilterChange}>
									</lightning-combobox>
									<lightning-combobox
										label="Device Type"
										value={assetFilters.deviceType}
										options={deviceTypeFilterOptions}
										data-field="deviceType"
										onchange={handleAssetFilterChange}>
									</lightning-combobox>
									<lightning-combobox
										label="Manufacturer"
										value={assetFilters.manufacturer}
										options={manufacturerFilterOptions}
										data-field="manufacturer"
										onchange={handleAssetFilterChange}>
									</lightning-combobox>
									<lightning-combobox
										label="Model"
										value={assetFilters.model}
										options={modelFilterOptions}
										data-field="model"
										onchange={handleAssetFilterChange}>
									</lightning-combobox>
								</div>
								<template lwc:if={multiAssetFilterEmpty}>
									<p class="multi-asset-status">No assets match the product filters.</p>
								</template>
								<template lwc:else>
									<div class="asset-pick-list">
										<template for:each={availableInspectAssets} for:item="asset">
											<label key={asset.rowKey} class="asset-pick-row">
												<input
													class="asset-pick-check"
													type="checkbox"
													checked={asset.selected}
													data-id={asset.id}
													onchange={handleMultiAssetToggle} />
												<span class="asset-pick-text">
													<span class="asset-pick-name">{asset.nameLine}</span>
													<span class="asset-pick-dates">{asset.dateLine}</span>
												</span>
											</label>
										</template>
									</div>
								</template>
							</template>
							<template lwc:if={multiAssetError}>
								<p class="error-text">{multiAssetError}</p>
							</template>
							<div class="form-actions">
								<lightning-button
									label="Cancel"
									onclick={handleMultiAssetCancel}>
								</lightning-button>
								<template lwc:if={multiAssetCanLink}>
									<lightning-button
										label="Link Assets"
										variant="brand"
										onclick={handleMultiAssetConfirm}>
									</lightning-button>
								</template>
							</div>
						</div>
					</template>

					<div class="tab-search slds-m-bottom_small">
						<lightning-input
							type="search"
							label="Search"
							variant="label-hidden"
							placeholder={activeTabSearchPlaceholder}
							value={activeTabSearchTerm}
							onchange={handleTabSearchChange}>
						</lightning-input>
					</div>

					<template lwc:if={activeTabHasNoSearchResults}>
						<p class="no-search-results">No lines match your search.</p>
					</template>

					<template for:each={activeTabModel.lines} for:item="line">
						<div key={line.Id} class="slds-m-bottom_x-small">

							<!-- Card. Tapping the info area toggles edit (same
								 behavior as the pencil icon). The action buttons
								 sit outside .woli-info so they don't bubble. -->
							<div class={line.cardClass}>
								<div class="woli-info" data-id={line.Id} onclick={handleEditToggle}>
									<div class="woli-description">{line.title}</div>
									<div class="woli-meta">
										<template lwc:if={line.showLineType}>
											<span class="line-type-chip">{line.lineTypeLabel}</span>
										</template>
										{line.metaLine}
									</div>
									<template lwc:if={line.isNew}>
										<span class="new-badge">New</span>
									</template>
									<template lwc:if={line.showMobilePictureCount}>
										<span class="picture-count-badge">{line.mobilePictureCountLabel}</span>
									</template>
									<template lwc:if={line.isDirty}>
										<span class="dirty-badge">Modified</span>
									</template>
								</div>
								<!-- All lines (existing and new) get edit + delete -->
								<div class="woli-actions">
									<lightning-button-icon
										icon-name="utility:edit"
										alternative-text="Edit"
										title="Edit"
										variant="border-filled"
										size="medium"
										data-id={line.Id}
										onclick={handleEditToggle}>
									</lightning-button-icon>
									<lightning-button-icon
										icon-name="utility:delete"
										alternative-text="Delete"
										title="Delete"
										variant="border-filled"
										size="medium"
										data-id={line.Id}
										onclick={handleDelete}>
									</lightning-button-icon>
								</div>
							</div>

							<template lwc:if={line.editError}>
								<p class="error-text slds-m-top_x-small">{line.editError}</p>
							</template>

							<!-- Inline edit form -->
							<template lwc:if={line.isEditing}>
								<div class="edit-form">

									<!-- Time tab (Travel + Labor) -->
									<template lwc:if={line.isTimeSchema}>
										<div class="field-grid">
											<div class="field-full">
												<lightning-combobox
													label="Line Type"
													value={line.editLineType}
													options={timeLineTypeOptions}
													required
													data-id={line.Id}
													data-field="lineType"
													onchange={handleEditFieldChange}>
												</lightning-combobox>
											</div>
											<div class="field-full">
												<lightning-record-picker
													label="Assigned Resource"
													placeholder="Search active resources…"
													object-api-name="ServiceResource"
													value={line.editAssignedResId}
													filter={resourcePickerFilter}
													display-info={resourcePickerDisplayInfo}
													matching-info={resourcePickerMatchingInfo}
													data-id={line.Id}
													data-field="assignedResourceId"
													onchange={handleLookupChange}>
												</lightning-record-picker>
											</div>
											<div class="field-full">
												<lightning-input
													label="Start Date"
													type="datetime"
													value={line.editStartDate}
													data-id={line.Id}
													data-field="startDate"
													onchange={handleEditFieldChange}>
												</lightning-input>
											</div>
											<div class="field-full">
												<lightning-input
													label="End Date"
													type="datetime"
													value={line.editEndDate}
													data-id={line.Id}
													data-field="endDate"
													onchange={handleEditFieldChange}>
												</lightning-input>
											</div>
											<div class="field-full read-only-field">
												<div class="read-only-label">Duration</div>
												<div class="read-only-value">{line.editDurationLabel}</div>
											</div>
										</div>
									</template>

									<template lwc:elseif={line.isProductServicedSchema}>
										<div class="field-grid">
											<div class="field-full">
												<lightning-input
													type="checkbox"
													label="Cancel Line"
													checked={line.editCanceled}
													data-id={line.Id}
													data-field="canceled"
													onchange={handleEditFieldChange}>
												</lightning-input>
											</div>
											<div class="field-full">
												<lightning-record-picker
													label="Assigned Resource"
													placeholder="Search active resources…"
													object-api-name="ServiceResource"
													value={line.editAssignedResId}
													filter={resourcePickerFilter}
													display-info={resourcePickerDisplayInfo}
													matching-info={resourcePickerMatchingInfo}
													required={line.requiresInspectionDetails}
													data-id={line.Id}
													data-field="assignedResourceId"
													onchange={handleLookupChange}>
												</lightning-record-picker>
											</div>
											<div class="field-full">
												<lightning-record-picker
													label="Asset"
													placeholder="Search by serial number or name…"
													object-api-name="Asset"
													value={line.editAssetId}
													filter={productServicedAssetFilter}
													display-info={assetPickerDisplayInfo}
													matching-info={assetPickerMatchingInfo}
													required
													data-id={line.Id}
													data-field="assetId"
													onchange={handleLookupChange}>
												</lightning-record-picker>
											</div>
											<div class="field-full">
											<lightning-combobox
												label="Inspection Outcome"
												placeholder="Select inspection outcome…"
												value={line.editInspectionOutcome}
												options={inspectionOutcomeOptions}
												required={line.requiresInspectionDetails}
												data-id={line.Id}
												data-field="inspectionOutcome"
												onchange={handleEditFieldChange}>
											</lightning-combobox>
											</div>
											<div class="field-full">
												<div class="picture-field-label">Mobile Device Picture</div>
												<div class="picture-field-actions">
													<label
														class="mobile-picture-button"
														data-scope="line"
														data-picture-slot={line.pictureSlot}
														data-save-key={line.pictureSaveKey}
														data-line-number={line.pictureLineNumber}
														data-id={line.Id}>
														<input
															type="file"
															accept="image/*"
															class="mobile-picture-input"
															data-scope="line"
															data-picture-slot={line.pictureSlot}
															data-save-key={line.pictureSaveKey}
															data-line-number={line.pictureLineNumber}
															data-id={line.Id}
															onchange={handleMobilePictureSelected} />
														Mobile Device Picture
													</label>
													<span class="picture-count">{line.mobilePictureCountLabel}</span>
												</div>
												<template lwc:if={line.hasMobilePictures}>
													<div class="picture-strip picture-strip_in-form">
														<template for:each={line.mobilePictures} for:item="picture">
															<div key={picture.key} class="picture-tile">
																<button
																	type="button"
																	class="picture-thumb-btn"
																	data-key={picture.key}
																	data-scope="line"
																	data-line-id={line.Id}
																	onclick={handleReviewPicture}>
																	<template lwc:if={picture.previewUrl}>
																		<img
																			class="picture-thumb"
																			src={picture.previewUrl}
																			alt="Mobile Device Picture"
																			data-version-id={picture.contentVersionId}
																			onerror={handlePicturePreviewError} />
																	</template>
																</button>
																<lightning-button-icon
																	class="picture-delete"
																	icon-name="utility:delete"
																	alternative-text="Delete picture"
																	title="Delete picture"
																	variant="border-filled"
																	size="small"
																	data-key={picture.key}
																	data-scope="line"
																	data-line-id={line.Id}
																	onclick={handleDeletePicture}>
																</lightning-button-icon>
																<template lwc:if={picture.hasComment}>
																	<div class="picture-comment-caption" title={picture.comment}>{picture.commentPreview}</div>
																</template>
															</div>
														</template>
													</div>
												</template>
											</div>
											<template lwc:if={line.showRepairCenterFields}>
												<div class="field-full">
													<lightning-textarea
														label="Not Inspected Reason"
														value={line.editNotInspectedReason}
														required
														data-id={line.Id}
														data-field="notInspectedReason"
														onchange={handleEditFieldChange}>
													</lightning-textarea>
												</div>
												<div class="field-full">
													<div class="repair-center-title">Return Order Info</div>
												</div>
												<div class="field-full">
													<lightning-input
														key={line.repairMakeKey}
														label="Make"
														value={line.editSerialNumber}
														required
														data-id={line.Id}
														data-field="serialNumber"
														onchange={handleEditFieldChange}>
													</lightning-input>
												</div>
												<div class="field-full">
													<lightning-input
														key={line.repairModelKey}
														label="Model"
														value={line.editModel}
														required
														data-id={line.Id}
														data-field="model"
														onchange={handleEditFieldChange}>
													</lightning-input>
												</div>
												<div class="field-full">
													<lightning-combobox
														label="Department"
														value={line.editDepartmentId}
														options={departmentOptions}
														placeholder="Select a department"
														required
														data-id={line.Id}
														data-field="departmentId"
														onchange={handleEditFieldChange}>
													</lightning-combobox>
												</div>
												<div class="field-full">
													<lightning-textarea
														label="Reported Problem"
														value={line.editReportedProblem}
														required
														data-id={line.Id}
														data-field="reportedProblem"
														onchange={handleEditFieldChange}>
													</lightning-textarea>
												</div>
												<div class="field-full">
													<lightning-input
														type="checkbox"
														label="Additional Services"
														checked={line.editAdditionalServices}
														data-id={line.Id}
														data-field="additionalServices"
														onchange={handleEditFieldChange}>
													</lightning-input>
												</div>
												<template lwc:if={line.showInsulationField}>
													<div class="field-full">

							value={reviewPictureComment}
							max-length="1000"
							onchange={handleReviewPictureCommentChange}>
						</lightning-textarea>
					</div>
				</div>
				<footer class="slds-modal__footer">
					<template lwc:if={reviewPictureCanSaveComment}>
						<lightning-button label="Save Comment" variant="brand" onclick={handleSaveReviewPictureComment}></lightning-button>
					</template>
					<lightning-button label="Delete" variant="destructive" onclick={handleDeleteReviewedPicture}></lightning-button>
					<lightning-button label="Close" onclick={handleClosePictureReview}></lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open picture-review-backdrop"></div>
	</template>

	<template lwc:if={showPictureCommentCapture}>
		<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="picture-comment-capture-heading" class="slds-modal slds-fade-in-open picture-comment-capture-modal">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<h2 id="picture-comment-capture-heading" class="slds-modal__title">Add picture comment</h2>
				</header>
				<div class="slds-modal__content slds-p-around_medium picture-comment-capture-content">
					<template lwc:if={pictureCommentCapturePreviewUrl}>
						<img class="picture-comment-capture-preview" src={pictureCommentCapturePreviewUrl} alt="Mobile Device Picture preview" />
					</template>
					<lightning-textarea
						label="Comment (optional)"
						value={pictureCommentDraftText}
						max-length="1000"
						placeholder="Describe this picture"
						onchange={handlePictureCommentDraftChange}>
					</lightning-textarea>
				</div>
				<footer class="slds-modal__footer">
					<lightning-button label="Cancel" onclick={handlePictureCommentCaptureCancel}></lightning-button>
					<lightning-button label="Save picture" variant="brand" onclick={handlePictureCommentCaptureConfirm}></lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open picture-comment-capture-backdrop"></div>
	</template>

</template>
