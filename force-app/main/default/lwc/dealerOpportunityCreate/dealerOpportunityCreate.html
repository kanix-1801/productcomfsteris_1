<template>
    <template if:true={isOpen}>
        <section role="dialog" aria-modal="true" aria-labelledby="create-title" class="modal-backdrop" onclick={close}>
            <div class="modal" onclick={stopClose}>
                <header class="modal-header">
                    <h2 id="create-title">Create Opportunity</h2>
                    <button type="button" class="close-button" onclick={close}>Close</button>
                </header>
                <template if:true={errorMessage}>
                    <p class="form-error" role="alert">{errorMessage}</p>
                </template>
                <template if:true={isFinalizing}>
                    <p class="form-status">Saving the opportunity...</p>
                </template>
                <div class="standard-form">
                    <template if:true={recordTypeId}>
                        <lightning-record-form
                            object-api-name="Opportunity"
                            record-type-id={recordTypeId}
                            layout-type="Full"
                            columns="2"
                            density="comfy"
                            onsuccess={handleSuccess}
                            oncancel={close}
                            onerror={handleError}>
                        </lightning-record-form>
                    </template>
                </div>
            </div>
        </section>
    </template>
</template>
