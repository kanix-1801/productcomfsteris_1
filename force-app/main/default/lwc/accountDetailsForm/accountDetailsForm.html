<template>
    <template if:true={hasRecordId}>
        <lightning-record-form
            record-id={recordId}
            object-api-name="Account"
            mode={formMode}
            fields={accountFields}
            columns="2"
            density="comfy"
            onsuccess={handleSuccess}
            onerror={handleError}
        >
        </lightning-record-form>
    </template>
    <template if:false={hasRecordId}>
        <div class="slds-p-around_medium slds-text-color_weak">
            No account record is available.
        </div>
    </template>
</template>
