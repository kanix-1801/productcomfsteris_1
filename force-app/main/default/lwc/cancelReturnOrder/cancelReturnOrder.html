<template>
    <lightning-card title="Cancel Return Order" icon-name="standard:return_order">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <template if:true={loadError}>
                <div class="slds-m-around_medium slds-text-color_error" role="alert">
                    {loadError}
                </div>
                <div class="slds-m-around_medium slds-text-align_right">
                    <lightning-button label="Close" onclick={handleClose}></lightning-button>
                </div>
            </template>

            <template if:false={loadError}>
                <div class="slds-m-around_medium">
                    <p class="slds-m-bottom_small">
                        Return Order:
                        <strong>{returnOrderLabel}</strong>
                    </p>

                    <template if:true={showBlockedState}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_medium" role="status">
                            {context.blockReason}
                        </div>
                        <div class="slds-text-align_right">
                            <lightning-button label="Close" onclick={handleClose}></lightning-button>
                        </div>
                    </template>

                    <template if:true={showForm}>
                        <p class="slds-m-bottom_medium">
                            Cancel this Return Order before it has been received. Open line items
                            will also be marked as canceled.
                        </p>

                        <lightning-combobox
                            label="Cancel Reason"
                            value={cancelReason}
                            options={cancelReasonOptions}
                            required
                            onchange={handleCancelReasonChange}>
                        </lightning-combobox>

                        <lightning-textarea
                            class="slds-m-top_small"
                            label="Cancel Reason Notes"
                            value={cancelReasonNotes}
                            onchange={handleCancelReasonNotesChange}>
                        </lightning-textarea>

                        <div class="slds-m-top_large slds-text-align_right">
                            <lightning-button
                                label="Close"
                                onclick={handleClose}
                                disabled={isSaving}>
                            </lightning-button>
                            <lightning-button
                                class="slds-m-left_x-small"
                                variant="destructive"
                                label="Cancel Return Order"
                                onclick={handleConfirmCancel}
                                disabled={isSubmitDisabled}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
