<template>
    <!-- Phase 2 standard related list card; all config from PropsJson__c -->
    <lightning-card title={cardTitle} icon-name={cardIcon}>
        <template lwc:if={showNew}>
            <div slot="actions">
                <lightning-button
                    label={newButtonText}
                    variant="brand"
                    onclick={handleNewRecord}>
                </lightning-button>
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>

        <template lwc:elseif={hasRecords}>
            <div class={datatableContainerClass}>
                <lightning-datatable
                    key-field="id"
                    data={records}
                    columns={datatableColumns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">
                No records found.
            </div>
        </template>
    </lightning-card>
</template>
