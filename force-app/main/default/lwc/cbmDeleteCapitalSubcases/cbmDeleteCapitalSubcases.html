<template>
    <lightning-card title="Capital Line Subcases">
        <div class="slds-p-around_medium">

            <template if:true={hasRows}>
                <p class="slds-m-bottom_small">
                    {capitalSubcases.length} Capital Line Subcase(s) found.
                    All listed subcases will be deleted along with their related Tasks.
                </p>
            </template>

            <template if:false={hasRows}>
                <p class="slds-text-color_weak slds-m-bottom_small">
                    No Capital Line Subcases found under this Case.
                </p>
            </template>

            <!-- ✅ NO CHECKBOX DATATABLE -->
            <lightning-datatable
                key-field="id"
                data={capitalSubcases}
                columns={columns}
                max-row-selection="0"
                hide-checkbox-column>
            </lightning-datatable>

            <div class="slds-m-top_large slds-text-align_right">
                <lightning-button
                    variant="destructive"
                    label="Delete Capital Subcases"
                    onclick={handleDeleteClick}
                    disabled={disableDelete}>
                </lightning-button>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <template if:true={showConfirm}>
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Confirm Deletion</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <p>
                            Are you sure you want to delete 
                            <b>ALL</b> Capital Line Subcases
                            and their related Tasks?
                        </p>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancel}
                            disabled={isBusy}>
                        </lightning-button>
                        <lightning-button
                            variant="destructive"
                            label="Confirm Delete"
                            onclick={handleConfirmDelete}
                            disabled={isBusy}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
