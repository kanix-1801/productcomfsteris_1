<template>
    <template lwc:if={shouldDisplayComponent}>
        <div class="component-wrapper">
            <section class="related-list-container">
                <div class="related-list-header">
                    <div class="header-title">
                        <lightning-icon
                            icon-name="standard:opportunity"
                            size="small"
                            alternative-text="Child Account Opportunities">
                        </lightning-icon>

                        <h2 class="slds-text-heading_small">
                            {title}
                        </h2>
                    </div>

                    <lightning-button-icon
                        class="refresh-button"
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        title="Refresh Child Account Opportunities"
                        onclick={handleRefresh}
                        disabled={isLoading}>
                    </lightning-button-icon>
                </div>

                <template lwc:if={isLoading}>
                    <div class="spinner-container">
                        <lightning-spinner
                            alternative-text="Loading Child Account Opportunities"
                            size="medium">
                        </lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasError}>
                    <div class="slds-p-around_medium slds-text-color_error" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <template lwc:if={hasSuccessfulResponse}>
                    <template lwc:if={resultLimitReached}>
                        <div
                            class="slds-notify slds-notify_alert slds-alert_warning slds-m-around_small"
                            role="alert">
                            <span class="slds-assistive-text">Warning</span>
                            <h2>
                                The maximum Opportunity display limit was reached.
                                Additional Opportunities may exist.
                            </h2>
                        </div>
                    </template>

                    <template lwc:if={hasOpportunities}>
                        <div class="datatable-container">
                            <lightning-datatable
                                key-field="opportunityId"
                                data={opportunities}
                                columns={columns}
                                hide-checkbox-column
                                sorted-by={sortedBy}
                                sorted-direction={sortDirection}
                                onsort={handleSort}
                                column-widths-mode="fixed">
                            </lightning-datatable>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="empty-state">
                            No Child Account Opportunities Found
                        </div>
                    </template>
                </template>
            </section>
        </div>
    </template>
</template>
