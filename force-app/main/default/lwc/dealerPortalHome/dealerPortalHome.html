<template>
    <div class="portal-page">
        <header class="welcome-row">
            <div>
                <h1>Welcome back, let's close some deals!</h1>
                <p>Your dealer pipeline, expected orders, and opportunities that need attention.</p>
            </div>
            <lightning-button variant="brand" label="Create Opportunity" onclick={openCreate}></lightning-button>
        </header>

        <template if:true={errorMessage}>
            <p class="form-error" role="alert">{errorMessage}</p>
        </template>

        <section class="metric-row">
            <article class="metric-card">
                <img class="metric-icon" src={pipelineIconUrl} alt="" />
                <p class="metric-label">Open Pipeline Value</p>
                <p class="metric-value">{openPipelineLabel}</p>
            </article>
            <article class="metric-card">
                <img class="metric-icon" src={activeIconUrl} alt="" />
                <p class="metric-label">Total Open Opportunities</p>
                <p class="metric-value">{openCountLabel}</p>
            </article>
            <article class="metric-card">
                <span class="metric-icon metric-green">✓</span>
                <p class="metric-label">Closed Won</p>
                <p class="metric-value">{closedWonLabel}</p>
                <p class="metric-note">{closedWonCountLabel}</p>
            </article>
            <template for:each={stageCountCards} for:item="card">
                <article key={card.stageName} class="metric-card">
                    <span class={card.iconClass}>{card.mark}</span>
                    <div>
                        <p class="metric-label">{card.label}</p>
                        <p class="metric-value">{card.count}</p>
                    </div>
                </article>
            </template>
        </section>

        <section class="insight-grid">
            <article class="panel">
                <header class="panel-header">
                    <h2>Past-Due Opportunities</h2>
                    <button type="button" class="text-button" onclick={viewAllPastDue}>View All</button>
                </header>
                <c-dealer-opportunity-table
                    records={pastDueOpportunities}
                    variant="pastdue"
                    empty-message="No past-due opportunities.">
                </c-dealer-opportunity-table>
            </article>
            <article class="panel">
                <header class="panel-header">
                    <h2>Pipeline by Stage</h2>
                </header>
                <template if:true={hasStageChart}>
                    <p class="funnel-total">Sum of Amount: {stageTotalLabel}</p>
                    <div class="funnel-layout">
                        <div class="funnel">
                            <template for:each={stageFunnel} for:item="segment">
                                <div key={segment.stageName} class="funnel-segment" style={segment.style}>
                                    <span>{segment.valueLabel}</span>
                                </div>
                            </template>
                        </div>
                        <ul class="funnel-legend">
                            <li class="legend-title">Stage</li>
                            <template for:each={stageFunnel} for:item="segment">
                                <li key={segment.stageName}>
                                    <span>{segment.stageName}</span>
                                    <span class="legend-swatch" style={segment.swatchStyle}></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <template if:false={hasStageChart}>
                    <p class="empty-copy">No open pipeline to chart.</p>
                </template>
            </article>
        </section>

        <section class="chart-grid">
            <article class="panel">
                <h2>Quarterly Pipeline Trend</h2>
                <template if:true={hasQuarterChart}>
                    <div class="vchart">
                        <div class="vchart-axis">
                            <template for:each={quarterAxis} for:item="tick">
                                <span key={tick.key}>{tick.label}</span>
                            </template>
                        </div>
                        <div class="vchart-plot">
                            <div class="grid-lines" aria-hidden="true"></div>
                            <template for:each={quarterColumns} for:item="col">
                                <div key={col.label} class="vchart-col">
                                    <div class="vchart-track">
                                        <div class="vchart-bar" style={col.style}>
                                            <span class="vchart-amount">{col.valueLabel}</span>
                                        </div>
                                    </div>
                                    <span class="vchart-xlabel">{col.label}</span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <template if:false={hasQuarterChart}>
                    <p class="empty-copy">No quarterly pipeline is available.</p>
                </template>
            </article>
            <article class="panel">
                <h2>Pipeline by Business Unit</h2>
                <div class="chart-list">
                    <template if:true={hasBusinessUnitChart}>
                        <template for:each={businessUnitBars} for:item="bar">
                            <div key={bar.label} class="bar-row">
                                <span class="bar-label">{bar.label}</span>
                                <span class="bar-track"><span class="bar-fill" style={bar.style}></span></span>
                                <strong class="bar-value">{bar.valueLabel}</strong>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasBusinessUnitChart}>
                        <p class="empty-copy">No business unit pipeline is available.</p>
                    </template>
                </div>
            </article>
        </section>

        <article class="panel">
            <header class="panel-header">
                <h2>Recently Created Opportunities</h2>
                <button type="button" class="text-button" onclick={viewOpportunities}>View All</button>
            </header>
            <c-dealer-opportunity-table
                records={recentOpportunities}
                variant="recent"
                empty-message="No recent opportunities available.">
            </c-dealer-opportunity-table>
        </article>
    </div>
    <c-dealer-opportunity-create is-open={isCreateOpen} onclose={closeCreate} oncreated={handleCreated}></c-dealer-opportunity-create>
</template>
