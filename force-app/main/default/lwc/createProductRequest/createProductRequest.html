<template>
    <section class="screen">
        <template lwc:if={showPageTitle}>
            <h1 class="slds-text-heading_small slds-p-horizontal_medium slds-p-top_medium">{labels.title}</h1>
        </template>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text={labels.loading} size="medium"></lightning-spinner>
        </template>

        <template lwc:if={loadError}>
            <div class="slds-m-around_medium slds-text-color_error" role="alert">{loadError}</div>
            <div class="slds-m-horizontal_medium slds-m-bottom_medium">
                <lightning-button label={labels.close} onclick={handleClose}></lightning-button>
            </div>
        </template>

        <template lwc:if={showBlocked}>
            <div class="slds-m-around_medium" role="alert">{context.blockMessage}</div>
            <div class="slds-m-horizontal_medium slds-m-bottom_medium">
                <lightning-button label={labels.close} onclick={handleClose}></lightning-button>
            </div>
        </template>

        <template lwc:if={showForm}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <h2 class="slds-text-title_caps slds-m-bottom_small">{labels.requestDetails}</h2>

                <template lwc:if={hasWorkOrder}>
                    <article class="work-order slds-box slds-m-bottom_medium">
                        <p class="slds-text-title_caps">{labels.workOrder}</p>
                        <p class="slds-text-heading_small">{context.workOrderNumber}</p>
                        <p>{context.subject}</p>
                    </article>
                </template>

                <template lwc:if={showServiceResourcePicker}>
                    <lightning-combobox
                        class="slds-m-bottom_small"
                        label={labels.serviceResource}
                        value={serviceResourceId}
                        options={serviceResourceOptions}
                        required
                        onchange={handleServiceResourceChange}>
                    </lightning-combobox>
                </template>

                <lightning-input
                    class="slds-m-bottom_small"
                    type="datetime"
                    label={labels.requiredDeliveryDate}
                    value={needByDate}
                    required
                    onchange={handleNeedByDateChange}>
                </lightning-input>

                <lightning-combobox
                    class="slds-m-bottom_small"
                    label={labels.shipmentType}
                    value={shipmentType}
                    options={shipmentTypeOptions}
                    required
                    onchange={handleShipmentTypeChange}>
                </lightning-combobox>

                <lightning-input
                    class="slds-m-bottom_small"
                    type="checkbox"
                    label={labels.shipSet}
                    checked={shipSet}
                    onchange={handleShipSetChange}>
                </lightning-input>

                <template lwc:if={hasWorkOrder}>
                    <lightning-radio-group
                        class="slds-m-bottom_small"
                        label={labels.shipTo}
                        options={shipToOptions}
                        value={shipToMode}
                        type="button"
                        required
                        onchange={handleShipToChange}>
                    </lightning-radio-group>
                </template>

                <template lwc:if={showMyLocation}>
                    <lightning-combobox
                        label={labels.address}
                        value={addressId}
                        options={addressOptions}
                        required
                        onchange={handleAddressChange}>
                    </lightning-combobox>
                    <template lwc:if={showNoAddresses}>
                        <p class="slds-m-top_x-small slds-text-color_error" role="status">{labels.noAddresses}</p>
                    </template>
                </template>

                <template lwc:if={showCustomer}>
                    <lightning-combobox
                        label={labels.customer}
                        value={shipToAccountId}
                        options={shipToAccountOptions}
                        required
                        onchange={handleShipToAccountChange}>
                    </lightning-combobox>
                </template>

                <div class="slds-grid slds-grid_align-spread slds-m-top_large slds-m-bottom_x-small">
                    <h2 class="slds-text-heading_small">{labels.parts}</h2>
                    <p>{partsSummaryText}</p>
                </div>

                <div class="slds-grid slds-gutters_x-small">
                    <div class="slds-col slds-grow">
                        <lightning-input
                            type="search"
                            label={labels.addPart}
                            value={searchTerm}
                            onchange={handleSearchInput}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-grow-none slds-p-top_large">
                        <lightning-button-icon
                            icon-name="utility:scan"
                            alternative-text={labels.scanPart}
                            title={labels.scanPart}
                            onclick={handleScan}>
                        </lightning-button-icon>
                    </div>
                </div>

                <template lwc:if={searchMessage}>
                    <p class="slds-m-top_x-small" role="status">{searchMessage}</p>
                </template>

                <template lwc:if={isSearching}>
                    <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
                </template>

                <template lwc:if={hasSearchResults}>
                    <ul class="slds-m-top_x-small" aria-label={labels.searchResults}>
                        <template for:each={searchResults} for:item="result">
                            <li key={result.productId} class="result">
                                <lightning-input
                                    type="checkbox"
                                    label={result.choiceLabel}
                                    name={result.productId}
                                    checked={result.selected}
                                    onchange={handleToggleResult}>
                                </lightning-input>
                            </li>
                        </template>
                    </ul>
                    <lightning-button
                        class="slds-m-top_x-small"
                        label={labels.addSelected}
                        disabled={isAddSelectedDisabled}
                        onclick={handleAddSelected}>
                    </lightning-button>
                </template>

                <ul class="slds-m-top_small">
                    <template for:each={partsRows} for:item="part">
                        <li key={part.key} class="part slds-box slds-m-bottom_x-small" data-key={part.key} data-product-id={part.productId}>
                            <div class="part-head">
                                <div class="part-main">
                                    <p class="slds-text-title_bold">{part.name}</p>
                                    <p class="slds-text-body_small">{part.productCode}<template lwc:if={part.quantityUnitOfMeasure}> · {part.quantityUnitOfMeasure}</template></p>
                                    <template lwc:if={part.requiredOnWorkOrder}>
                                        <span class="slds-badge slds-m-top_xx-small">{labels.requiredOnWorkOrder}</span>
                                    </template>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-top_small">
                                        <span class="slds-m-right_small" id={part.key}>{labels.quantity}</span>
                                        <lightning-button-icon
                                            icon-name="utility:dash"
                                            alternative-text={labels.decreaseQuantity}
                                            title={labels.decreaseQuantity}
                                            data-key={part.key}
                                            onclick={handleDecreaseQuantity}>
                                        </lightning-button-icon>
                                        <span class="quantity" aria-labelledby={part.key}>{part.quantity}</span>
                                        <lightning-button-icon
                                            icon-name="utility:add"
                                            alternative-text={labels.increaseQuantity}
                                            title={labels.increaseQuantity}
                                            data-key={part.key}
                                            onclick={handleIncreaseQuantity}>
                                        </lightning-button-icon>
                                    </div>
                                </div>
                                <div class="part-side">
                                    <lightning-button-icon
                                        class="part-remove"
                                        icon-name="utility:delete"
                                        alternative-text={labels.removePart}
                                        title={labels.removePart}
                                        data-key={part.key}
                                        onclick={handleRemovePart}>
                                    </lightning-button-icon>
                                    <div class="ship-set">
                                        <lightning-input
                                            type="checkbox"
                                            label={labels.shipSet}
                                            name={part.key}
                                            checked={part.shipSet}
                                            onchange={handleLineShipSetChange}>
                                        </lightning-input>
                                    </div>
                                    <template lwc:if={part.substitutePart}>
                                        <p class="substitute">
                                            {labels.substitutePart}<br />
                                            {part.substitutePart}
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>

                <template lwc:if={formError}>
                    <div class="slds-m-top_small slds-text-color_error" role="alert">{formError}</div>
                </template>
            </div>

            <footer class="slds-grid slds-gutters_x-small slds-p-horizontal_medium slds-p-vertical_small footer">
                <div class="slds-col">
                    <lightning-button class="stretch" label={labels.cancel} onclick={handleClose} disabled={isSaving}></lightning-button>
                </div>
                <div class="slds-col">
                    <lightning-button class="stretch footer-save" variant="brand" label={labels.save} onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
                </div>
            </footer>
        </template>

        <template lwc:if={showConfirm}>
            <div class="slds-p-around_medium">
                <p class="slds-m-bottom_medium">{createdMessage}</p>
                <p class="slds-m-bottom_medium">{labels.submitQuestion}</p>
                <template lwc:if={formError}>
                    <div class="slds-m-bottom_small slds-text-color_error" role="alert">{formError}</div>
                </template>
                <div class="slds-grid slds-gutters_x-small">
                    <div class="slds-col">
                        <lightning-button class="stretch" label={labels.no} onclick={handleClose} disabled={isSaving}></lightning-button>
                    </div>
                    <div class="slds-col">
                        <lightning-button class="stretch footer-save" variant="brand" label={labels.yes} onclick={handleSubmitYes} disabled={isSaving}></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <template lwc:if={showErpConfirm}>
            <article class="erp-card">
                <h1 class="erp-header">{labels.erpScreenTitle}</h1>
                <div class="erp-body">
                    <p class="slds-text-title_bold">{labels.erpSubmitHeading}</p>
                    <lightning-formatted-rich-text value={erpSubmitBodyHtml}></lightning-formatted-rich-text>
                    <lightning-formatted-rich-text
                        class="slds-m-top_x-small"
                        value={labels.erpSubmitContinue}>
                    </lightning-formatted-rich-text>
                    <template lwc:if={showPriorResult}>
                        <p class="slds-text-title_bold slds-m-top_medium">{labels.erpPriorHeading}</p>
                        <p>{labels.erpStatus}: {oracleIntegrationStatus}</p>
                        <p>{labels.erpMessage}: {oracleIntegrationMessage}</p>
                    </template>
                    <template lwc:if={formError}>
                        <div class="slds-m-top_small slds-text-color_error" role="alert">{formError}</div>
                    </template>
                </div>
                <footer class="erp-footer">
                    <lightning-button
                        variant="brand"
                        label={labels.erpSubmit}
                        onclick={handleErpSubmit}
                        disabled={isSaving}>
                    </lightning-button>
                </footer>
            </article>
        </template>

        <template lwc:if={showErpSuccess}>
            <article class="erp-card">
                <h1 class="erp-header">{labels.erpScreenTitle}</h1>
                <div class="erp-body">
                    <p class="slds-text-title_bold" role="status">{labels.erpSavedHeading}</p>
                    <p>{labels.erpSavedBody}</p>
                    <lightning-formatted-rich-text
                        class="slds-m-top_x-small"
                        value={labels.erpSavedBoomi}>
                    </lightning-formatted-rich-text>
                </div>
                <footer class="erp-footer">
                    <lightning-button variant="brand" label={labels.finish} onclick={handleClose}></lightning-button>
                </footer>
            </article>
        </template>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text={labels.saving} size="medium"></lightning-spinner>
        </template>
    </section>
</template>
