<template>
    <lightning-card title={label.cardTitle} icon-name="standard:location">
        <div class="slds-p-around_medium">
            <p class="slds-m-bottom_medium">{label.instructions}</p>

            <div class="slds-m-bottom_medium">
                <lightning-file-upload
                    label={label.uploadLabel}
                    name="districtZoneAlignmentUpload"
                    accept={acceptedFormats}
                    onuploadfinished={handleUploadFinished}
                    disabled={isBusy}
                ></lightning-file-upload>
                <template lwc:if={uploadedFileText}>
                    <p class="slds-m-top_x-small slds-text-body_small" data-id="uploaded-file">{uploadedFileText}</p>
                </template>
            </div>

            <div class="slds-m-bottom_medium">
                <lightning-button
                    variant="brand"
                    label={label.startUpload}
                    onclick={handleStartUpload}
                    disabled={isStartDisabled}
                    class="slds-m-right_small"
                    data-id="start-upload"
                ></lightning-button>
                <lightning-button
                    label={label.downloadTemplate}
                    onclick={handleDownloadTemplate}
                    disabled={isBusy}
                    class="slds-m-right_small"
                    data-id="download-template"
                ></lightning-button>
                <lightning-button
                    label={label.downloadErrorFile}
                    onclick={handleDownloadErrorFile}
                    disabled={isBusy}
                    data-id="download-error-file"
                ></lightning-button>
            </div>

            <template lwc:if={isBusy}>
                <lightning-spinner alternative-text={label.processing} size="small"></lightning-spinner>
            </template>

            <template lwc:if={result}>
                <div class="slds-box slds-theme_shade slds-m-top_small" data-id="result">
                    <p>{result.summary}</p>
                    <p class="slds-text-body_small slds-m-top_x-small">{emailMessage}</p>
                    <template lwc:if={hasErrors}>
                        <ul class="slds-m-top_small slds-list_dotted">
                            <template for:each={visibleErrors} for:item="errorItem">
                                <li key={errorItem.key}>{errorItem.message}</li>
                            </template>
                        </ul>
                        <template lwc:if={hasHiddenErrors}>
                            <p class="slds-text-body_small slds-m-top_x-small">{moreErrorsText}</p>
                        </template>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
