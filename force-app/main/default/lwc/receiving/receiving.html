                                                                    value={item.quantityReceived}
                                                                    data-item-key={item.itemKey}
                                                                    oninput={handleQuantityReceivedChange}
                                                                />
                                                            </div>
                                                        </div>
                                                        <div class="verify-field">
                                                            <div class="verify-field__label">
                                                                <abbr class="slds-required" title="required">*</abbr>
                                                                Disinfected?
                                                            </div>
                                                            <div class="verify-field__control">
                                                                <div
                                                                    class="decision-pills"
                                                                    role="group"
                                                                    aria-label="Disinfected"
                                                                >
                                                                    <button
                                                                        type="button"
                                                                        class={item.disinfectedCleanClass}
                                                                        data-item-key={item.itemKey}
                                                                        data-field="disinfected"
                                                                        data-value="Clean"
                                                                        onclick={handleDecisionClick}
                                                                    >
                                                                        Clean
                                                                    </button>
                                                                    <button
                                                                        type="button"
                                                                        class={item.disinfectedContaminatedClass}
                                                                        data-item-key={item.itemKey}
                                                                        data-field="disinfected"
                                                                        data-value="Contaminated"
                                                                        onclick={handleDecisionClick}
                                                                    >
                                                                        Contaminated
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="verify-field verify-field_checkbox">
                                                            <div class="verify-field__label verify-field__label_spacer" aria-hidden="true">
                                                                &nbsp;
                                                            </div>
                                                            <div class="verify-field__control verify-field__control_checkbox">
                                                                <label class="resi-check">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={item.resiTestPerformed}
                                                                        data-item-key={item.itemKey}
                                                                        onchange={handleResiTestChange}
                                                                    />
                                                                    <span class="resi-check__text">Resi-Test Performed</span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div class="mod-form">
                                                        <div class="mod-form__title">Mod Form</div>
                                                        <div
                                                            class={item.modFormDropzoneClass}
                                                            data-item-key={item.itemKey}
                                                            ondragover={handleModFormDragOver}
                                                            ondragleave={handleModFormDragLeave}
                                                            ondrop={handleModFormDrop}
                                                        >
                                                            <input
                                                                type="file"
                                                                class="slds-hide"
                                                                data-id="mod-form-file-input"
                                                                data-item-key={item.itemKey}
                                                                accept={modFormAccept}
                                                                multiple
                                                                onchange={handleModFormFileSelected}
                                                            />
                                                            <div class="mod-form__actions">
                                                                <lightning-button
                                                                    label="Take Photo"
                                                                    icon-name="utility:photo"
                                                                    data-item-key={item.itemKey}
                                                                    onclick={handleOpenModFormCamera}
                                                                    disabled={isModFormBusy}
                                                                ></lightning-button>
                                                                <template lwc:if={item.hasModFormPhotos}>
                                                                    <span class="mod-form__count">
                                                                        {item.modFormPhotoCountLabel}
                                                                    </span>
                                                                </template>
                                                            </div>
                                                            <button
                                                                type="button"
                                                                class="mod-form__drop-label"
                                                                data-item-key={item.itemKey}
                                                                onclick={handleModFormChooseFiles}
                                                                disabled={isModFormBusy}
                                                            >
                                                                Or drop files
                                                            </button>
                                                        </div>
                                                        <template lwc:if={modFormError}>
                                                            <div class="slds-text-color_error slds-m-top_x-small" role="alert">
                                                                {modFormError}
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <template lwc:else>
                                                    <div class="verify-row">
                                                        <template lwc:if={item.showQuantityVerify}>
                                                            <template lwc:if={isReturnOrderPath}>
                                                                <div class="verify-field">
                                                                    <div class="verify-field__label">
                                                                        Total Quantity on Order
                                                                    </div>
                                                                    <div class="verify-field__control">
                                                                        <div class="verify-readonly" aria-readonly="true">
                                                                            {item.quantityReturned}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                            <div class="verify-field">
                                                                <label class="verify-field__label" for={item.qtyReceivedInputId}>
                                                                    <abbr class="slds-required" title="required">*</abbr>
                                                                    Quantity Received
                                                                </label>
                                                                <div class="verify-field__control">
                                                                    <input
                                                                        id={item.qtyReceivedInputId}
                                                                        class="verify-input"
                                                                        type="number"
                                                                        min="0"
                                                                        step="1"
                                                                        value={item.quantityReceived}
                                                                        data-item-key={item.itemKey}
                                                                        oninput={handleQuantityReceivedChange}
                                                                    />
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <template lwc:if={item.showSerialVerify}>
                                                            <div class="verify-field">
                                                                <div class="verify-field__label">
                                                                    {item.serialVerifyLabel}
                                                                </div>
                                                                <div class="verify-field__control">
                                                                    <div
                                                                        class="decision-pills"
                                                                        role="group"
                                                                        aria-label={item.serialVerifyLabel}
                                                                    >
                                                                        <button
                                                                            type="button"
                                                                            class={item.serialYesClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="serialMatch"
                                                                            data-value="Yes"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            Yes
                                                                        </button>
                                                                        <button
                                                                            type="button"
                                                                            class={item.serialNoClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="serialMatch"
                                                                            data-value="No"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            No
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <template lwc:if={item.showModelVerify}>
                                                            <div class="verify-field">
                                                                <div class="verify-field__label">
                                                                    {item.modelVerifyLabel}
                                                                </div>
                                                                <div class="verify-field__control">
                                                                    <div
                                                                        class="decision-pills"
                                                                        role="group"
                                                                        aria-label={item.modelVerifyLabel}
                                                                    >
                                                                        <button
                                                                            type="button"
                                                                            class={item.modelYesClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="modelMatch"
                                                                            data-value="Yes"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            Yes
                                                                        </button>
                                                                        <button
                                                                            type="button"
                                                                            class={item.modelNoClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="modelMatch"
                                                                            data-value="No"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            No
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <template lwc:if={item.showDisinfectedVerify}>
                                                            <div class="verify-field">
                                                                <div class="verify-field__label">
                                                                    <abbr class="slds-required" title="required">*</abbr>
                                                                    Disinfected?
                                                                </div>
                                                                <div class="verify-field__control">
                                                                    <div
                                                                        class="decision-pills"
                                                                        role="group"
                                                                        aria-label="Disinfected"
                                                                    >
                                                                        <button
                                                                            type="button"
                                                                            class={item.disinfectedCleanClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="disinfected"
                                                                            data-value="Clean"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            Clean
                                                                        </button>
                                                                        <button
                                                                            type="button"
                                                                            class={item.disinfectedContaminatedClass}
                                                                            data-item-key={item.itemKey}
                                                                            data-field="disinfected"
                                                                            data-value="Contaminated"
                                                                            onclick={handleDecisionClick}
                                                                        >
                                                                            Contaminated
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="verify-field verify-field_checkbox">
                                                                <div class="verify-field__label verify-field__label_spacer" aria-hidden="true">
                                                                    &nbsp;
                                                                </div>
                                                                <div class="verify-field__control verify-field__control_checkbox">
                                                                    <label class="resi-check">
                                                                        <input
                                                                            type="checkbox"
                                                                            checked={item.resiTestPerformed}
                                                                            data-item-key={item.itemKey}
                                                                            onchange={handleResiTestChange}
                                                                        />
                                                                        <span class="resi-check__text">Resi-Test Performed</span>
                                                                    </label>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <template lwc:if={item.showContaminationReason}>
                                                    <div class="contamination-reason">
                                                        <div class="contamination-reason__title">
                                                            Contamination Reason
                                                        </div>
                                                        <div
                                                            class="contamination-reason__options"
                                                            role="group"
                                                            aria-label="Contamination Reason"
                                                        >
                                                            <label class="resi-check">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={item.resiTestFailed}
                                                                    data-item-key={item.itemKey}
                                                                    data-reason="resiTestFailed"
                                                                    onchange={handleContaminationReasonChange}
                                                                />
                                                                <span class="resi-check__text">Resi-Test Failed</span>
                                                            </label>
                                                            <label class="resi-check">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={item.visualInspection}
                                                                    data-item-key={item.itemKey}
                                                                    data-reason="visualInspection"
                                                                    onchange={handleContaminationReasonChange}
                                                                />
                                                                <span class="resi-check__text">Visual Inspection</span>
                                                            </label>
                                                            <label class="resi-check">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={item.bioBag}
                                                                    data-item-key={item.itemKey}
                                                                    data-reason="bioBag"
                                                                    onchange={handleContaminationReasonChange}
                                                                />
                                                                <span class="resi-check__text">Bio Bag</span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </template>

                                                <template lwc:if={item.showOutsideVendor}>
                                                    <div class="outside-vendor">
                                                        <div class="outside-vendor__title">Outside Vendor</div>
                                                        <div class="outside-vendor__subtitle">
                                                            Send item(s) to an external vendor for repair services.
                                                        </div>
                                                        <div class="outside-vendor__fields">
                                                            <div class="outside-vendor__field">
                                                                <lightning-combobox
                                                                    label="Select Vendor"
                                                                    placeholder="Select"
                                                                    options={vendorAccountOptions}
                                                                    value={item.vendorAccountId}
                                                                    required={item.isVendorRequired}
                                                                    data-item-key={item.itemKey}
                                                                    onchange={handleVendorChange}
                                                                ></lightning-combobox>
                                                            </div>
                                                            <div class="outside-vendor__field">
                                                                <lightning-textarea
                                                                    label="Instructions to Vendor"
                                                                    value={item.instructionsToVendor}
                                                                    data-item-key={item.itemKey}
                                                                    onchange={handleVendorInstructionsChange}
                                                                ></lightning-textarea>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>

                                                <template lwc:if={item.showInlineActions}>
                                                    <div class="inline-actions">
                                                        <div class="verification-panel__title">Action</div>
                                                        <div class="verification-panel__subtitle">
                                                            Please choose a following action.
                                                        </div>
                                                        <div class="actions-grid">
                                                            <div class="actions-column" role="list">
                                                                <template
                                                                    for:each={item.leftActionOptions}
                                                                    for:item="action"
                                                                >
                                                                    <button
                                                                        key={action.key}
                                                                        type="button"
                                                                        class={action.cardClass}
                                                                        role="listitem"
                                                                        data-item-key={item.itemKey}
                                                                        data-action-key={action.key}
                                                                        onclick={handleActionSelect}
                                                                    >
                                                                        <span
                                                                            class="action-card__icon"
                                                                            aria-hidden="true"
                                                                        >
                                                                            <lightning-icon
                                                                                icon-name={action.iconName}
                                                                                size="small"
                                                                                alternative-text=""
                                                                            ></lightning-icon>
                                                                        </span>
                                                                        <span class="action-card__text">
                                                                            <span class="action-card__label"
                                                                                >{action.label}</span
                                                                            >
                                                                            <span
                                                                                class="action-card__description"
                                                                                >{action.description}</span
                                                                            >
                                                                        </span>
                                                                    </button>
                                                                </template>
                                                            </div>
                                                            <div class="actions-column" role="list">
                                                                <template
                                                                    for:each={item.rightActionOptions}
                                                                    for:item="action"
                                                                >
                                                                    <button
                                                                        key={action.key}
                                                                        type="button"
                                                                        class={action.cardClass}
                                                                        role="listitem"
                                                                        data-item-key={item.itemKey}
                                                                        data-action-key={action.key}
                                                                        onclick={handleActionSelect}
                                                                    >
                                                                        <span
                                                                            class="action-card__icon"
                                                                            aria-hidden="true"
                                                                        >
                                                                            <lightning-icon
                                                                                icon-name={action.iconName}
                                                                                size="small"
                                                                                alternative-text=""
                                                                            ></lightning-icon>
                                                                        </span>
                                                                        <span class="action-card__text">
                                                                            <span class="action-card__label"
                                                                                >{action.label}</span
                                                                            >
                                                                            <span
                                                                                class="action-card__description"
                                                                                >{action.description}</span
                                                                            >
                                                                        </span>
                                                                    </button>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>

                                                <template lwc:if={item.showNextButton}>
                                                    <div class="verification-panel__actions">
                                                        <lightning-button
                                                            variant="brand"
                                                            label="Next"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleItemNext}
                                                        ></lightning-button>
                                                    </div>
                                                </template>
                                                </template>
                                            </div>
                                            </template>
                                        </div>
                                    </template>
                                </section>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak">No items to receive.</p>
                        </template>
                    </div>

                    <template lwc:if={showStandardItemList}>
                        <div class="receive-footer">
                            <div class="receive-footer__left">
                                <template lwc:if={showAddItemButton}>
                                    <lightning-button
                                        variant="brand"
                                        label="Add Item to Receive"
                                        icon-name="utility:add"
                                        onclick={handleAddItemToReceive}
                                    ></lightning-button>
                                </template>
                            </div>
                            <div class="receive-footer__right">
                                <template lwc:if={showCancelButton}>
                                    <lightning-button
                                        label="Cancel"
                                        onclick={handleCancelReceiving}
                                    ></lightning-button>
                                </template>
                                <template lwc:if={showReceiveNextOrderButton}>
                                    <lightning-button
                                        variant="brand"
                                        label="Receive Next Order"
                                        onclick={handleReceiveNextOrder}
                                    ></lightning-button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </template>

        <template lwc:if={isModFormCameraOpen}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="receiving-mod-form-camera-title"
                class="slds-modal slds-fade-in-open camera-modal"
            >
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            title="Close"
                            class="slds-modal__close"
                            onclick={handleCloseModFormCamera}
                        ></lightning-button-icon>
                        <h2
                            id="receiving-mod-form-camera-title"
                            class="slds-modal__title slds-hyphenate"
                        >
                            {modFormPhotoModalTitle}
                        </h2>
                        <p
                            class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                        >
                            {photoModalSubtitle}
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-m-bottom_medium">
                            <input
                                type="file"
                                class="slds-hide"
                                data-id="mod-form-modal-file-input"
                                accept={modFormAccept}
                                multiple
                                onchange={handleModFormModalFileSelected}
                            />
                            <lightning-button
                                label="Upload files"
                                icon-name="utility:upload"
                                onclick={handleModFormModalChooseFiles}
                                disabled={isModFormPhotoModalBusy}
                                class="slds-m-right_small"
                            ></lightning-button>
                        </div>

                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Camera</h3>
                        <div class="slds-m-bottom_small">
                            <lightning-combobox
                                label="Camera"
                                value={selectedCameraId}
                                options={cameraOptions}
                                onchange={handleCameraChange}
                                disabled={isCameraStarting}
                                placeholder="Select a camera"
                            ></lightning-combobox>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-button
                                label="Start camera"
                                onclick={handleStartCamera}
                                disabled={isStartCameraDisabled}
                                class="slds-m-right_small"
                            ></lightning-button>
                            <lightning-button
                                label="Capture photo"
                                variant="brand"
                                onclick={handleCaptureModFormPhoto}
                                disabled={isCaptureDisabled}
                                class="slds-m-right_small"
                            ></lightning-button>
                            <lightning-button
                                label="Stop camera"
                                onclick={handleStopCamera}
                                disabled={isStopCameraDisabled}
                            ></lightning-button>
                        </div>
                        <template lwc:if={cameraError}>
                            <div class="slds-text-color_error slds-m-bottom_small" role="alert">
                                {cameraError}
                            </div>
                        </template>
                        <video
                            class="camera-preview"
                            autoplay
                            playsinline
                            muted
                            lwc:dom="manual"
                        ></video>
                        <canvas class="slds-hide" lwc:dom="manual"></canvas>

                        <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">
                            Photos
                        </h3>
                        <template lwc:if={hasModFormModalPhotos}>
                            <table
                                class="slds-table slds-table_cell-buffer slds-table_bordered files-table"
                            >
                                <thead>
                                    <tr>
                                        <th scope="col" class="files-table__col-icon"></th>
                                        <th scope="col">Title</th>
                                        <th scope="col">Type</th>
                                        <th scope="col" class="files-table__col-actions">
                                            Actions
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={modFormModalPhotos} for:item="file">
                                        <tr key={file.contentDocumentId}>
                                            <td class="files-table__col-icon">
                                                <template lwc:if={file.showThumbnail}>
                                                    <img
                                                        src={file.thumbnailUrl}
                                                        alt=""
                                                        class="files-table__thumb"
                                                        data-doc-id={file.contentDocumentId}
                                                        onerror={handleModFormThumbnailError}
                                                    />
                                                </template>
                                                <template lwc:else>
                                                    <div class="files-table__icon-slot">
                                                        <lightning-icon
                                                            icon-name="doctype:image"
                                                            size="small"
                                                            alternative-text={file.fileExtension}
                                                        ></lightning-icon>
                                                    </div>
                                                </template>
                                            </td>
                                            <td>
                                                <div
                                                    class="slds-grid slds-grid_vertical-align-center"
                                                >
                                                    <div class="slds-col slds-grow">
                                                        <lightning-input
                                                            variant="label-hidden"
                                                            label="Photo title"
                                                            value={file.editTitle}
                                                            data-doc-id={file.contentDocumentId}
                                                            onchange={handleModFormPhotoTitleChange}
                                                            onkeyup={handleModFormPhotoTitleChange}
                                                            disabled={file.isRenaming}
                                                            class={file.titleInputClass}
                                                        ></lightning-input>
                                                    </div>
                                                    <div
                                                        class="slds-col slds-no-flex slds-m-left_xx-small"
                                                    >
                                                        <lightning-button-icon
                                                            icon-name="utility:check"
                                                            alternative-text="Save title"
                                                            title={file.titleSaveTitle}
                                                            variant={file.titleSaveVariant}
                                                            class={file.titleSaveClass}
                                                            data-doc-id={file.contentDocumentId}
                                                            onclick={handleSaveModFormPhotoTitle}
                                                            disabled={file.isSaveTitleDisabled}
                                                        ></lightning-button-icon>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>{file.fileExtension}</td>
                                            <td class="files-table__col-actions">
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Delete photo"
                                                    title="Delete photo"
                                                    data-item-key={modFormCameraItemKey}
                                                    data-document-id={file.contentDocumentId}
                                                    onclick={handleRemoveModFormPhoto}
                                                    disabled={file.isDeleting}
                                                ></lightning-button-icon>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-body_regular">{photoModalEmptyMessage}</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Done"
                            variant="brand"
                            onclick={handleCloseModFormCamera}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open camera-modal-backdrop"></div>
        </template>
    </div>
</template>
