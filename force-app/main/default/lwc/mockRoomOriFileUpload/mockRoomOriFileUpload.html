<template>
    <div class="upload">
        <p class="hint">Photos and other files are optional. They are added to the request when you click Next.</p>
        <lightning-file-upload
            label="Supporting photos or files"
            multiple
            onuploadfinished={handleUploadFinished}>
        </lightning-file-upload>
        <template if:true={hasUploads}>
            <p class="saved">Ready to attach: {fileNames}</p>
        </template>
    </div>
</template>
