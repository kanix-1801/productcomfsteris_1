<template>
    <div class={pageShellClass}>
        <template lwc:if={isMenu}>
            <section class="menu-panel">
                <h1 class="slds-text-heading_large">Repair Coordinator Actions</h1>
                <p class="subtitle">Select which action you’d like to perform.</p>

                <div class="action-grid">
                    <button class="action-tile" type="button" onclick={openViewWorkOrderSummary}>
                        <span class="action-icon">
                            <lightning-icon
                                class="action-icon__glyph"
                                icon-name="custom:custom62"
                                size="medium"
                                alternative-text="View Work Order Summary"
                            ></lightning-icon>
                        </span>
                        <span class="action-copy">
                            <span class="action-title">View Work Order Summary</span>
                            <span class="action-description">
                                View the current status of Device and Instrument Work Orders.
                            </span>
                        </span>
                    </button>
                    <button class="action-tile" type="button" onclick={openAssignWorkOrder}>
                        <span class="action-icon">
                            <lightning-icon
                                class="action-icon__glyph"
                                icon-name="utility:groups"
                                size="medium"
                                alternative-text="Assign Work Order"
                            ></lightning-icon>
                        </span>
                        <span class="action-copy">
                            <span class="action-title">Assign Work Order</span>
                            <span class="action-description">
                                Select to assign Racks and Service Teams to Work Orders.
                            </span>
                        </span>
                    </button>
                    <button class="action-tile" type="button" onclick={openOverrideSignatures}>
                        <span class="action-icon">
                            <lightning-icon
                                class="action-icon__glyph"
                                icon-name="utility:signature"
                                size="medium"
                                alternative-text="Override Repair Signatures"
                            ></lightning-icon>
                        </span>
                        <span class="action-copy">
                            <span class="action-title">Override Repair Signatures</span>
                            <span class="action-description">
                                Adjust technician sign-off on completed repair activities.
                            </span>
                        </span>
                    </button>
                </div>
            </section>
        </template>

        <template lwc:elseif={isSummary}>
            <c-view-work-order-summary
                show-return-to-menu
                onreturntomenu={returnToMenu}
            ></c-view-work-order-summary>
        </template>

        <template lwc:elseif={isAssign}>
            <section class="scan-panel">
                <div class="scan-header">
                    <div>
                        <h1 class="slds-text-heading_large">Assign Work Order</h1>
                        <p class="subtitle">Assign Racks and Service Teams to Work Orders</p>
                    </div>
                    <lightning-button
                        label="Return to Actions Menu"
                        onclick={returnToMenu}
                        disabled={isBusy}
                    ></lightning-button>
                </div>

                <ol class="instructions slds-list_ordered">
                    <li>Scan in the work order (bin) tag.</li>
                    <li>
                        Scan in barcodes for the repair rack and/or service team you’d like
                        to assign to the Work Order.
                    </li>
                </ol>

                <div class="scan-field slds-form-element">
                    <label class="slds-form-element__label" for="barcode-input">
                        Scan Barcode
                    </label>
                    <div class="slds-form-element__control">
                        <input
                            id="barcode-input"
                            data-id="barcode-input"
                            class="slds-input"
                            type="text"
                            autocomplete="off"
                            value={scanValue}
                            disabled={isBusy}
                            oninput={handleScanInput}
                            onkeydown={handleScanKeyDown}
                        />
                    </div>
                </div>

                <template lwc:if={errorMessage}>
                    <div class="message message_error" role="alert">{errorMessage}</div>
                </template>
                <template lwc:if={successMessage}>
                    <div class="message message_success" role="status">{successMessage}</div>
                </template>

                <template lwc:if={isBusy}>
                    <div class="spinner-wrap">
                        <lightning-spinner
                            size="small"
                            alternative-text="Processing barcode"
                        ></lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasWorkOrder}>
                    <section class="assignment-panel" aria-label="Current Work Order assignments">
                        <div class="assignment-panel__header">
                            <span class="assignment-panel__eyebrow">Currently assigning</span>
                            <span class="assignment-panel__title">
                                Work Order {workspace.workOrderNumber}
                            </span>
                            <span class="assignment-panel__status">
                                Work Order Status: {workspace.workOrderStatus}
                            </span>
                        </div>

                        <ul class="assignment-rows">
                            <li class="assignment-row">
                                <span class="assignment-row__label">Rack</span>
                                <span class={rackValueClass}>{rackDisplay}</span>
                                <span class="assignment-row__action">
                                    <template lwc:if={hasRack}>
                                        <lightning-button
                                            variant="base"
                                            label="Remove"
                                            title="Remove Rack from this Work Order"
                                            onclick={removeRackAssignment}
                                            disabled={isBusy}
                                        ></lightning-button>
                                    </template>
                                </span>
                            </li>

                            <li class="assignment-row">
                                <span class="assignment-row__label">Service Team</span>
                                <span class={serviceTeamValueClass}>{serviceTeamDisplay}</span>
                                <span class="assignment-row__action">
                                    <template lwc:if={hasServiceTeam}>
                                        <lightning-button
                                            variant="base"
                                            label="Remove"
                                            title="Remove Service Team from this Work Order"
                                            onclick={removeServiceTeamAssignment}
                                            disabled={isBusy}
                                        ></lightning-button>
                                    </template>
                                </span>
                            </li>
                        </ul>
                    </section>
                </template>
            </section>
        </template>

        <template lwc:elseif={isOverride}>
            <section class="scan-panel">
                <div class="scan-header">
                    <div>
                        <h1 class="slds-text-heading_large">Override Repair Signatures</h1>
                        <p class="subtitle">
                            Adjust technician sign-off on completed repair activities.
                        </p>
                    </div>
                    <lightning-button
                        label="Return to Actions Menu"
                        onclick={returnToMenu}
                        disabled={isBusy}
                    ></lightning-button>
                </div>

                <div class="scan-field slds-form-element">
                    <label class="slds-form-element__label" for="signature-barcode-input">
                        Scan Barcode
                    </label>
                    <div class="slds-form-element__control">
                        <input
                            id="signature-barcode-input"
                            data-id="barcode-input"
                            class="slds-input"
                            type="text"
                            autocomplete="off"
                            value={scanValue}
                            disabled={isBusy}
                            oninput={handleScanInput}
                            onkeydown={handleScanKeyDown}
                        />
                    </div>
                </div>

                <template lwc:if={errorMessage}>
                    <div class="message message_error" role="alert">{errorMessage}</div>
                </template>

                <template lwc:if={isBusy}>
                    <div class="spinner-wrap">
                        <lightning-spinner
                            size="small"
                            alternative-text="Processing barcode"
                        ></lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasSignatureWorkOrder}>
                    <section class="work-performed" aria-label="Work Performed">
                        <h2 class="slds-text-heading_small">Work Performed</h2>
                        <p class="work-performed__wo">
                            Work Order {signatureWorkspace.workOrderNumber}
                        </p>

                        <template lwc:if={isDeviceTable}>
                            <table class="summary-table">
                                <colgroup>
                                    <col class="summary-table__col-category" />
                                    <col class="summary-table__col-item-number" />
                                    <col class="summary-table__col-description" />
                                    <col class="summary-table__col-signature" />
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th class="summary-table__col-category">Category</th>
                                        <th class="summary-table__col-item-number">Item Number</th>
                                        <th class="summary-table__col-description">Description</th>
                                        <th class="summary-table__col-signature">Apply Signature</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={workPerformedRows} for:item="row">
                                        <tr key={row.workOrderLineItemId}>
                                            <td class="summary-table__col-category">{row.category}</td>
                                            <td class="summary-table__col-item-number">{row.itemNumber}</td>
                                            <td class="summary-table__col-description">{row.description}</td>
                                            <td class="summary-table__col-signature">
                                                <div class="signature-stack">
                                                    <template for:each={row.signatures} for:item="signature">
                                                        <div key={signature.id} class="signature-line">
                                                            <span>{signature.userName}</span>
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Remove signature"
                                                                title="Remove signature"
                                                                variant="bare"
                                                                data-signature-id={signature.id}
                                                                onclick={handleRemoveSignature}
                                                                disabled={isBusy}
                                                            ></lightning-button-icon>
                                                        </div>
                                                    </template>
                                                    <lightning-button
                                                        label="Add Signature"
                                                        variant="neutral"
                                                        data-line-id={row.workOrderLineItemId}
                                                        onclick={openAddSignature}
                                                        disabled={isBusy}
                                                    ></lightning-button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <template lwc:if={isInstrumentTable}>
                            <table class="summary-table">
                                <colgroup>
                                    <col class="summary-table__col-item-number" />
                                    <col class="summary-table__col-product-name" />
                                    <col class="summary-table__col-qty" />
                                    <col class="summary-table__col-repair-desc" />
                                    <col class="summary-table__col-status" />
                                    <col class="summary-table__col-signature" />
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th class="summary-table__col-item-number">Item Number</th>
                                        <th class="summary-table__col-product-name">Product Name</th>
                                        <th class="summary-table__col-qty">Qty</th>
                                        <th class="summary-table__col-repair-desc">Repair Description</th>
                                        <th class="summary-table__col-status">Status</th>
                                        <th class="summary-table__col-signature">Apply Signature</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={workPerformedRows} for:item="row">
                                        <tr key={row.workOrderLineItemId}>
                                            <td class="summary-table__col-item-number">{row.itemNumber}</td>
                                            <td class="summary-table__col-product-name">{row.productName}</td>
                                            <td class="summary-table__col-qty">{row.quantity}</td>
                                            <td class="summary-table__col-repair-desc">{row.repairDescription}</td>
                                            <td class="summary-table__col-status">{row.status}</td>
                                            <td class="summary-table__col-signature">
                                                <div class="signature-stack">
                                                    <template for:each={row.signatures} for:item="signature">
                                                        <div key={signature.id} class="signature-line">
                                                            <span>{signature.userName}</span>
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Remove signature"
                                                                title="Remove signature"
                                                                variant="bare"
                                                                data-signature-id={signature.id}
                                                                onclick={handleRemoveSignature}
                                                                disabled={isBusy}
                                                            ></lightning-button-icon>
                                                        </div>
                                                    </template>
                                                    <lightning-button
                                                        label="Add Signature"
                                                        variant="neutral"
                                                        data-line-id={row.workOrderLineItemId}
                                                        onclick={openAddSignature}
                                                        disabled={isBusy}
                                                    ></lightning-button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <template lwc:if={hasNoRepairCodes}>
                            <p class="work-performed__empty">
                                No repair codes are on this Work Order.
                            </p>
                        </template>
                    </section>
                </template>
            </section>
        </template>
    </div>

    <template lwc:if={showCandidateModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="candidate-modal-heading"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="candidate-modal-heading" class="slds-text-heading_medium">
                        Which would you like to assign?
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="candidate-list">
                        <template for:each={candidateRows} for:item="candidate">
                            <button
                                key={candidate.recordId}
                                class={candidate.buttonClass}
                                type="button"
                                aria-pressed={candidate.isSelected}
                                data-record-id={candidate.recordId}
                                data-assignment-type={candidate.assignmentType}
                                onclick={toggleCandidate}
                            >
                                <span class="candidate-label">{candidate.label}</span>
                                <template lwc:if={candidate.detail}>
                                    <span class="candidate-detail">{candidate.detail}</span>
                                </template>
                            </button>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeCandidateModal}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small"
                        variant="brand"
                        label="Assign"
                        onclick={assignSelectedCandidates}
                        disabled={isAssignDisabled}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={showAddSignature}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="add-signature-heading"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="add-signature-heading" class="slds-text-heading_medium">
                        Add Signature
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="technician-search">
                            <abbr class="slds-required" title="required">*</abbr>
                            Technician
                        </label>
                        <div class="slds-form-element__control">
                            <input
                                id="technician-search"
                                class="slds-input"
                                type="text"
                                autocomplete="off"
                                value={technicianSearch}
                                disabled={isBusy}
                                oninput={handleTechnicianSearch}
                            />
                        </div>
                        <template lwc:if={hasTechnicianOptions}>
                            <div class="technician-results" role="listbox">
                                <template for:each={technicianOptions} for:item="option">
                                    <button
                                        key={option.userId}
                                        class="technician-option"
                                        type="button"
                                        role="option"
                                        data-user-id={option.userId}
                                        data-user-name={option.name}
                                        onclick={selectTechnician}
                                    >
                                        {option.name}
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                    <template lwc:if={modalError}>
                        <div class="message message_error" role="alert">{modalError}</div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeAddSignature}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small"
                        variant="brand"
                        label="Save"
                        onclick={saveSignature}
                        disabled={isSaveSignatureDisabled}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
