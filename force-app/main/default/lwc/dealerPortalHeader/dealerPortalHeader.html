<template>
    <div class="bar">
        <div class="brand">
            <img class="logo" src={logoUrl} alt="STERIS" />
            <span class="brand-divider" aria-hidden="true"></span>
            <span class="brand-title">Dealer Portal</span>
        </div>
        <nav class="tabs" aria-label="Dealer portal">
            <template for:each={tabs} for:item="tab">
                <button key={tab.key} type="button" class={tab.className} data-path={tab.path} onclick={openPage}>
                    {tab.label}
                </button>
            </template>
        </nav>
        <div class="user-menu">
            <template if:true={hasPhoto}>
                <img class="avatar" src={userPhoto} alt="" />
            </template>
            <template if:false={hasPhoto}>
                <span class="avatar avatar-fallback" aria-hidden="true">{userInitial}</span>
            </template>
            <span class="user-name">{userName}</span>
            <button type="button" class="logout" onclick={logout}>Log out</button>
        </div>
    </div>
</template>
