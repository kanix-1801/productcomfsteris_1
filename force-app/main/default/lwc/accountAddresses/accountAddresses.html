<template>
    <template if:true={hasRecords}>
        <lightning-datatable
            key-field="id"
            data={addresses}
            columns={columns}
            onrowaction={handleRowAction}
            hide-checkbox-column>
        </lightning-datatable>
    </template>

    <template if:false={hasRecords}>
        <div class="slds-p-around_medium">
            No Addresses Found
        </div>
    </template>
</template>
