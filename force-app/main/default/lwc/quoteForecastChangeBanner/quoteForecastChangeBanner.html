<template>
    <div class="slds-scoped-notification slds-scoped-notification_warning slds-m-bottom_small" role="status">
        <div class="slds-media slds-media_center">
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning"
                    size="x-small"
                    variant="warning"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p class="slds-text-body_small">
                    <strong>{bannerTitle}.</strong> {bannerMessage}
                </p>
            </div>
            <div class="slds-media__figure slds-media__figure_reverse">
                <lightning-button
                    label="Dismiss"
                    title="Dismiss"
                    variant="neutral"
                    onclick={handleDismissClick}
                    disabled={dismissDisabled}
                ></lightning-button>
            </div>
        </div>
    </div>

    <template lwc:if={showConfirmModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="forecast-dismiss-modal-heading"
            class="slds-modal slds-fade-in-open"
            onkeydown={handleModalKeyDown}
        >
            <div class="slds-modal__container slds-modal_small">
                <header class="slds-modal__header">
                    <h2 id="forecast-dismiss-modal-heading" class="slds-modal__title slds-hyphenate">
                        Confirm Dismiss
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium modal-content">
                    <template lwc:if={isYesLoading}>
                        <lightning-spinner
                            alternative-text="Loading"
                            size="small"
                            class="modal-spinner"
                        ></lightning-spinner>
                    </template>
                    <p class={modalMessageClass}>{confirmMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleConfirmCancel}
                        disabled={isModalBusy}
                        is-loading={isCancelLoading}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Yes"
                        class="slds-m-left_x-small"
                        onclick={handleConfirmYes}
                        disabled={isModalBusy}
                        is-loading={isYesLoading}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
