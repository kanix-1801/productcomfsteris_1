<template>
    <div class={rootClass}>
        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading Receiving" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={showScanPage}>
            <lightning-card title="Receiving" icon-name="custom:custom19">
                <div class="slds-p-around_medium">
                    <p class="slds-text-heading_small slds-m-bottom_small">Scan Order</p>
                    <div class="scan-order-row">
                        <div class="scan-order-row__input">
                            <c-repair-center-scan-input
                                label={scanFieldLabel}
                                placeholder={scanFieldPlaceholder}
                                value={scanInput}
                                disabled={isScanBusy}
                                onvaluechange={handleScanValueChange}
                                oncontinue={handleScanContinue}
                            ></c-repair-center-scan-input>
                        </div>
                        <template lwc:if={showCreateNewOrderButton}>
                            <div class="scan-order-row__action">
                                <button
                                    type="button"
                                    class="create-order-button"
                                    disabled={isCreateNewOrderButtonDisabled}
                                    onclick={handleCreateNewOrder}
                                >
                                    <span class="create-order-button__icon" aria-hidden="true">
                                        <span class="create-order-button__icon-mark">
                                            <lightning-icon
                                                icon-name="utility:add"
                                                size="xx-small"
                                            ></lightning-icon>
                                        </span>
                                    </span>
                                    <span class="create-order-button__text">Create New Order</span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <template lwc:if={scanErrorMessage}>
                        <div class="slds-text-color_error slds-m-top_small" role="alert">
                            {scanErrorMessage}
                        </div>
                    </template>

                    <template lwc:if={isResolving}>
                        <div class="slds-m-top_medium slds-is-relative slds-p-around_large">
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </template>

        <template lwc:if={showCreateNewOrderPage}>
            <lightning-card title={createOrderCardTitle} icon-name="standard:work_order">
                <div class="slds-p-around_medium">
                    <template lwc:if={showCreateOrderAccountSummary}>
                        <div class="shell-account shell-account_create-order slds-m-bottom_medium">
                            <div class="shell-account__details">
                                <div class="shell-account__name">{createOrderAccountName}</div>
                                <div class="shell-account__meta">{createOrderAccountMetaDisplay}</div>
                            </div>
                            <template lwc:if={showCreateOrderAddItemMenu}>
                                <div class="create-order-add-item-menu">
                                    <lightning-button-menu
                                        label="Add Item"
                                        alternative-text="Add Item"
                                        variant="brand"
                                        menu-alignment="right"
                                        onselect={handleCreateOrderAddItemMenuSelect}
                                    >
                                        <lightning-menu-subheader label="Select Type"></lightning-menu-subheader>
                                        <template for:each={createOrderAddItemMenuOptions} for:item="option">
                                            <lightning-menu-item
                                                key={option.key}
                                                value={option.value}
                                                label={option.label}
                                                disabled={option.disabled}
                                            ></lightning-menu-item>
                                        </template>
                                    </lightning-button-menu>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div class="slds-m-bottom_medium">
                        <lightning-progress-indicator
                            current-step={createOrderCurrentStep}
                            type="base"
                            variant="base"
                        >
                            <template for:each={createOrderProgressSteps} for:item="step">
                                <lightning-progress-step
                                    key={step.value}
                                    label={step.label}
                                    value={step.value}
                                ></lightning-progress-step>
                            </template>
                        </lightning-progress-indicator>
                    </div>

                    <template lwc:if={showCreateOrderAccountStep}>
                        <c-create-order-account-information
                            lwc:ref="createOrderAccountInfo"
                            onchange={handleCreateOrderAccountChange}
                        ></c-create-order-account-information>
                    </template>

                    <template lwc:if={showCreateOrderAddItemStep}>
                        <div class="create-order-add-item">
                            <h2 class="slds-text-heading_small">Add Item</h2>
                            <p class="slds-text-body_regular slds-m-top_xx-small slds-m-bottom_small">
                                Select a type of item to begin your Order.
                            </p>
                            <div class="create-order-item-type-table-wrapper">
                                <table
                                    class="slds-table slds-table_cell-buffer slds-table_bordered create-order-item-type-table"
                                >
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="create-order-item-type-table__type-col">
                                                Type
                                            </th>
                                            <th scope="col" class="create-order-item-type-table__details-col">
                                                Details
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={createOrderItemTypeOptions} for:item="option">
                                            <tr key={option.key} class={option.rowClass}>
                                                <th
                                                    scope="row"
                                                    class="create-order-item-type-table__type-col"
                                                    data-label="Type"
                                                >
                                                    <template lwc:if={option.isEnabled}>
                                                        <a
                                                            href="javascript:void(0);"
                                                            role="button"
                                                            class="create-order-item-type-table__type-link slds-text-link"
                                                            title={option.description}
                                                            data-item-type={option.itemType}
                                                            onclick={handleCreateOrderSelectItemType}
                                                        >
                                                            {option.typeLabel}
                                                        </a>
                                                    </template>
                                                    <template lwc:else>
                                                        <span
                                                            class="create-order-item-type-table__type-disabled"
                                                            title={option.description}
                                                        >
                                                            {option.typeLabel}
                                                        </span>
                                                    </template>
                                                </th>
                                                <td
                                                    class="create-order-item-type-table__details-col"
                                                    data-label="Details"
                                                >
                                                    <div
                                                        class="create-order-item-type-table__details-text"
                                                        title={option.description}
                                                    >
                                                        {option.description}
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>

                    <template lwc:if={showCreateOrderItemsHost}>
                        <div class={createOrderItemsHostClass}>
                            <c-create-order-items
                                lwc:ref="createOrderItems"
                                account-id={createOrderAccountId}
                                account-name={createOrderAccountName}
                            ></c-create-order-items>
                        </div>
                    </template>

                    <template lwc:if={showCreateOrderSummaryStep}>
                        <c-create-order-summary
                            groups={createOrderSummaryGroups}
                        ></c-create-order-summary>
                    </template>

                    <template lwc:if={showCreateOrderConfirmationStep}>
                        <c-create-order-confirmation
                            orders={createOrderConfirmationOrders}
                            onopenworkorder={handleCreateOrderOpenWorkOrder}
                        ></c-create-order-confirmation>
                    </template>

                    <div class="slds-grid slds-grid_align-end slds-m-top_medium slds-gutters_small">
                        <template lwc:if={showCreateOrderCancelButton}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    label="Cancel"
                                    disabled={isCreateOrderSubmitting}
                                    onclick={handleCancelCreateNewOrder}
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={showCreateOrderAddItemBack}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    label="Back"
                                    disabled={isCreateOrderSubmitting}
                                    onclick={handleCreateOrderBack}
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={showCreateOrderProductFooter}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    label="Back"
                                    disabled={isCreateOrderSubmitting}
                                    onclick={handleCreateOrderBack}
                                ></lightning-button>
                            </div>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    variant="brand"
                                    label="Next"
                                    disabled={isCreateOrderSubmitting}
                                    onclick={handleCreateOrderProductNext}
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={showCreateOrderSummaryFooter}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    label="Back"
                                    disabled={isCreateOrderSubmitting}
                                    onclick={handleCreateOrderBack}
                                ></lightning-button>
                            </div>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    variant="brand"
                                    label="Next"
                                    disabled={isCreateOrderSummaryNextDisabled}
                                    onclick={handleCreateOrderSummaryNext}
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={showCreateOrderConfirmationFooter}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    variant="brand"
                                    label="Close"
                                    onclick={handleCreateOrderConfirmationClose}
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={showCreateOrderAccountNext}>
                            <div class="slds-col slds-grow-none">
                                <lightning-button
                                    variant="brand"
                                    label="Next"
                                    disabled={isCreateOrderAccountNextDisabled}
                                    onclick={handleCreateOrderAccountNext}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-card>
        </template>

        <template lwc:if={showReceivePage}>
            <lightning-card icon-name="standard:return_order">
                <div slot="title" class="shell-card-title">
                    <span>{receiveCardTitle}</span>
                    <template lwc:if={showShipCompleteBadge}>
                        <span class="item-badge item-badge_info" title="Ship Complete">
                            <span class="item-badge__icon-mark" aria-hidden="true">i</span>
                            Ship Complete
                        </span>
                    </template>
                </div>
                <div slot="actions" class="shell-receiver">
                    <span class="shell-receiver__icon" aria-hidden="true">
                        <lightning-icon
                            icon-name="utility:user"
                            size="xx-small"
                            alternative-text=""
                        ></lightning-icon>
                    </span>
                    <span class="shell-receiver__label">RECEIVER:</span>
                    <span class="shell-receiver__name">{shellContext.receiverName}</span>
                </div>

                <div class="slds-p-around_medium">
                    <div class="shell-account slds-m-bottom_medium">
                        <div class="shell-account__details">
                            <div class="shell-account__name">{shellContext.accountName}</div>
                            <div class="shell-account__meta">{accountMetaDisplay}</div>
                        </div>
                        <template lwc:if={hasKeyIndicators}>
                            <div class="key-indicators" aria-label="Account indicators">
                                {keyIndicatorsDisplay}
                            </div>
                        </template>
                    </div>

                    <template lwc:if={isVendorWorkOrder}>
                        <div class="verification-panel vendor-verification" aria-label="Vendor verification">
                            <div class="verification-panel__title">Verification</div>
                            <div class="verification-panel__subtitle">
                                Please verify that the following was received from the vendor.
                            </div>
                            <template lwc:if={hasItems}>
                                <ul class="vendor-verify-list">
                                    <template for:each={vendorDisplayItems} for:item="item">
                                        <li key={item.itemKey} class="vendor-verify-row">
                                            <span class="vendor-verify-row__title">
                                                Item {item.itemNumber}: {item.displayTitle}
                                            </span>
                                            <div class="vendor-verify-row__toggle">
                                                <lightning-input
                                                    type="toggle"
                                                    label={item.vendorToggleLabel}
                                                    variant="label-hidden"
                                                    message-toggle-active=""
                                                    message-toggle-inactive=""
                                                    checked={item.vendorVerified}
                                                    data-item-key={item.itemKey}
                                                    onchange={handleVendorVerifiedToggle}
                                                ></lightning-input>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak">No items to verify.</p>
                            </template>
                            <div class="verification-panel__actions verification-panel__actions_split">
                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancelReceiving}
                                ></lightning-button>
                                <template lwc:if={showVendorSubmitButton}>
                                    <lightning-button
                                        variant="brand"
                                        label="Submit"
                                        onclick={handleVendorWorkOrderSubmit}
                                    ></lightning-button>
                                </template>
                            </div>
                        </div>
                    </template>

                    <div class="item-list" aria-label="Items to receive" lwc:if={showStandardItemList}>
                        <template lwc:if={hasItems}>
                            <template for:each={displayItems} for:item="item">
                                <section key={item.itemKey} class="item-card">
                                    <button
                                        type="button"
                                        class="item-card__header"
                                        data-item-key={item.itemKey}
                                        onclick={handleToggleItem}
                                        aria-expanded={item.isExpanded}
                                    >
                                        <lightning-icon
                                            icon-name={item.chevronIcon}
                                            size="x-small"
                                            alternative-text=""
                                            class="item-card__chevron"
                                        ></lightning-icon>
                                        <span class="item-card__title">{item.headerTitle}</span>
                                        <span class="item-card__badges">
                                            <template for:each={item.badges} for:item="badge">
                                                <span
                                                    key={badge.key}
                                                    class={badge.cssClass}
                                                    title={badge.label}
                                                >
                                                    <template lwc:if={badge.useIconMark}>
                                                        <span class="item-badge__icon-mark" aria-hidden="true"
                                                            >{badge.iconMark}</span>
                                                    </template>
                                                    <template lwc:else>
                                                        <lightning-icon
                                                            icon-name={badge.iconName}
                                                            size="xx-small"
                                                            alternative-text=""
                                                        ></lightning-icon>
                                                    </template>
                                                    {badge.label}
                                                </span>
                                            </template>
                                        </span>
                                    </button>

                                    <template lwc:if={item.isExpanded}>
                                        <div class="item-card__body">
                                            <template lwc:if={item.showActionsPanel}>
                                                <div class="actions-panel">
                                                    <nav class="actions-breadcrumb" aria-label="Item steps">
                                                        <button
                                                            type="button"
                                                            class="actions-breadcrumb__link"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleActionsBack}
                                                        >
                                                            Verification
                                                        </button>
                                                        <span class="actions-breadcrumb__sep" aria-hidden="true"
                                                            >&gt;</span
                                                        >
                                                        <span class="actions-breadcrumb__current">Actions</span>
                                                    </nav>
                                                    <div class="actions-panel__title">Action</div>
                                                    <div class="actions-panel__subtitle">
                                                        Please choose a following action.
                                                    </div>
                                                    <div class="actions-grid">
                                                        <div class="actions-column" role="list">
                                                            <template
                                                                for:each={item.leftActionOptions}
                                                                for:item="action"
                                                            >
                                                                <button
                                                                    key={action.key}
                                                                    type="button"
                                                                    class={action.cardClass}
                                                                    role="listitem"
                                                                    data-item-key={item.itemKey}
                                                                    data-action-key={action.key}
                                                                    onclick={handleActionSelect}
                                                                >
                                                                    <span
                                                                        class="action-card__icon"
                                                                        aria-hidden="true"
                                                                    >
                                                                        <lightning-icon
                                                                            icon-name={action.iconName}
                                                                            size="small"
                                                                            alternative-text=""
                                                                        ></lightning-icon>
                                                                    </span>
                                                                    <span class="action-card__text">
                                                                        <span class="action-card__label"
                                                                            >{action.label}</span
                                                                        >
                                                                        <span
                                                                            class="action-card__description"
                                                                            >{action.description}</span
                                                                        >
                                                                    </span>
                                                                </button>
                                                            </template>
                                                        </div>
                                                        <div class="actions-column" role="list">
                                                            <template
                                                                for:each={item.rightActionOptions}
                                                                for:item="action"
                                                            >
                                                                <button
                                                                    key={action.key}
                                                                    type="button"
                                                                    class={action.cardClass}
                                                                    role="listitem"
                                                                    data-item-key={item.itemKey}
                                                                    data-action-key={action.key}
                                                                    onclick={handleActionSelect}
                                                                >
                                                                    <span
                                                                        class="action-card__icon"
                                                                        aria-hidden="true"
                                                                    >
                                                                        <lightning-icon
                                                                            icon-name={action.iconName}
                                                                            size="small"
                                                                            alternative-text=""
                                                                        ></lightning-icon>
                                                                    </span>
                                                                    <span class="action-card__text">
                                                                        <span class="action-card__label"
                                                                            >{action.label}</span
                                                                        >
                                                                        <span
                                                                            class="action-card__description"
                                                                            >{action.description}</span
                                                                        >
                                                                    </span>
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <div class="actions-panel__footer">
                                                        <lightning-button
                                                            label="Back"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleActionsBack}
                                                        ></lightning-button>
                                                        <template lwc:if={showFinishReceivingOnActions}>
                                                            <lightning-button
                                                                variant="brand"
                                                                label="Finish Receiving"
                                                                icon-name="utility:print"
                                                                data-item-key={item.itemKey}
                                                                disabled={isFinishReceivingBusy}
                                                                onclick={handleFinishReceiving}
                                                            ></lightning-button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <template lwc:elseif={item.showRerunResiPanel}>
                                                <div class="actions-panel rerun-resi-panel">
                                                    <nav class="actions-breadcrumb" aria-label="Item steps">
                                                        <button
                                                            type="button"
                                                            class="actions-breadcrumb__link"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleNavigateToActions}
                                                        >
                                                            Verification &amp; Actions
                                                        </button>
                                                        <span class="actions-breadcrumb__sep" aria-hidden="true"
                                                            >&gt;</span
                                                        >
                                                        <span class="actions-breadcrumb__current"
                                                            >Rerun Resi-Test</span
                                                        >
                                                    </nav>
                                                    <div class="actions-panel__title">Rerun Resi-Test</div>
                                                    <div class="actions-panel__subtitle">
                                                        Rerun the Resi-Test for previously received Orders and add
                                                        disinfection code.
                                                    </div>
                                                    <div class="verify-row rerun-resi-panel__fields">
                                                        <div class="verify-field">
                                                            <div class="verify-field__label">
                                                                <abbr class="slds-required" title="required">*</abbr>
                                                                Disinfected?
                                                            </div>
                                                            <div class="verify-field__control">
                                                                <div
                                                                    class="decision-pills"
                                                                    role="group"
                                                                    aria-label="Disinfected"
                                                                >
                                                                    <button
                                                                        type="button"
                                                                        class={item.disinfectedCleanClass}
                                                                        data-item-key={item.itemKey}
                                                                        data-field="disinfected"
                                                                        data-value="Clean"
                                                                        onclick={handleDecisionClick}
                                                                    >
                                                                        Clean
                                                                    </button>
                                                                    <button
                                                                        type="button"
                                                                        class={item.disinfectedContaminatedClass}
                                                                        data-item-key={item.itemKey}
                                                                        data-field="disinfected"
                                                                        data-value="Contaminated"
                                                                        onclick={handleDecisionClick}
                                                                    >
                                                                        Contaminated
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="verify-field verify-field_checkbox">
                                                            <div
                                                                class="verify-field__label verify-field__label_spacer"
                                                                aria-hidden="true"
                                                            >
                                                                &nbsp;
                                                            </div>
                                                            <div class="verify-field__control verify-field__control_checkbox">
                                                                <label class="resi-check">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={item.resiTestPerformed}
                                                                        data-item-key={item.itemKey}
                                                                        onchange={handleResiTestChange}
                                                                    />
                                                                    <span class="resi-check__text"
                                                                        >Resi-Test Performed</span
                                                                    >
                                                                </label>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="actions-panel__footer">
                                                        <lightning-button
                                                            label="Back"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleRerunResiBack}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            variant="brand"
                                                            label="Submit"
                                                            data-item-key={item.itemKey}
                                                            disabled={item.isRerunSubmitDisabled}
                                                            onclick={handleRerunResiSubmit}
                                                        ></lightning-button>
                                                    </div>
                                                </div>
                                            </template>

                                            <template lwc:elseif={item.showCustomerCarePanel}>
                                                <div class="actions-panel customer-care-panel">
                                                    <nav class="actions-breadcrumb" aria-label="Item steps">
                                                        <button
                                                            type="button"
                                                            class="actions-breadcrumb__link"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleActionsBack}
                                                        >
                                                            Verification
                                                        </button>
                                                        <span class="actions-breadcrumb__sep" aria-hidden="true"
                                                            >&gt;</span
                                                        >
                                                        <button
                                                            type="button"
                                                            class="actions-breadcrumb__link"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleNavigateToActions}
                                                        >
                                                            Actions
                                                        </button>
                                                        <span class="actions-breadcrumb__sep" aria-hidden="true"
                                                            >&gt;</span
                                                        >
                                                        <span class="actions-breadcrumb__current"
                                                            >Contact Customer Care</span
                                                        >
                                                    </nav>
                                                    <div class="actions-panel__title">Contact Customer Care</div>
                                                    <div class="actions-panel__subtitle">
                                                        Resolve serial number, model, or other receipt discrepancies.
                                                    </div>
                                                    <div class="customer-care-form">
                                                        <div class="customer-care-form__field">
                                                            <lightning-checkbox-group
                                                                label="Reason Code"
                                                                value={item.customerCareDraftReasonCodes}
                                                                options={customerCareReasonOptions}
                                                                required
                                                                data-item-key={item.itemKey}
                                                                data-field="customerCareDraftReasonCodes"
                                                                onchange={handleCustomerCareFieldChange}
                                                            ></lightning-checkbox-group>
                                                        </div>
                                                        <div class="customer-care-form__field customer-care-form__field_notes">
                                                            <lightning-textarea
                                                                label="Notes"
                                                                value={item.customerCareDraftNotes}
                                                                data-item-key={item.itemKey}
                                                                data-field="customerCareDraftNotes"
                                                                onchange={handleCustomerCareFieldChange}
                                                            ></lightning-textarea>
                                                        </div>
                                                    </div>
                                                    <div class="actions-panel__footer">
                                                        <lightning-button
                                                            label="Back"
                                                            data-item-key={item.itemKey}
                                                            onclick={handleCustomerCareBack}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            variant="brand"
                                                            label="Submit"
                                                            data-item-key={item.itemKey}
                                                            disabled={item.isCustomerCareSubmitDisabled}
                                                            onclick={handleCustomerCareSubmit}
                                                        ></lightning-button>
                                                    </div>
                                                </div>
                                            </template>

                                            <template lwc:elseif={item.showAccessoriesPanel}>
                                                <div class="actions-panel accessories-panel">
                                                    <nav class="actions-breadcrumb" aria-label="Item steps">
                                                        <button
                                                            type="button"
                                                            class="actions-breadcrumb__link"
                                                            data-item-key={item.itemKey}
