<template>
    <div class="upload">
        <div class="label-row">
            <span class="field-label">Supporting photos or files</span>
            <lightning-helptext
                class="field-help"
                content="Optional supporting documents, such as customer site or location photographs, planning sheets, ceiling design proposals, and other documents relevant to the demonstration or Opportunity. They are added to the request when you click Next.">
            </lightning-helptext>
        </div>
        <lightning-file-upload
            class="native-upload"
            label=""
            multiple
            onuploadfinished={handleUploadFinished}>
        </lightning-file-upload>
        <template if:true={hasUploads}>
            <p class="saved">Ready to attach: {fileNames}</p>
        </template>
    </div>
</template>
