<template>

    <!-- OUTER CARD -->
    <div class="slds-card">

        <!-- TITLE ONLY (NO EXTRA HEADER SPACE) -->
        <div class="slds-p-horizontal_small slds-p-top_small">
            <h2 class="slds-text-heading_small">
                Order Lines ({totalCount})
            </h2>
        </div>

        <!-- TABLE (NO YELLOW SPACE NOW) -->
        <div
            class="slds-scrollable_x slds-table_header-fixed_container slds-m-top_x-small"
            style="height: 400px;"
        ><template if:true={hasOrderLines}>
            <lightning-datatable
                key-field="id"
                data={orderLines}
                columns={columns}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                onsort={handleSort}
                hide-checkbox-column
                show-row-number-column>
            </lightning-datatable>
        </template>
                
        <template if:false={hasOrderLines}>
            <div class="slds-text-align_center slds-p-vertical_medium slds-text-color_weak">
                No order lines to display
            </div>
        </template>

        </div>

        <!-- VIEW ALL (BOTTOM CENTER) -->
        <template if:true={showViewAll}>
            <div class="slds-align_absolute-center slds-p-vertical_small">
                <lightning-button
                    variant="base"
                    label="View All"
                    onclick={openModal}>
                </lightning-button>
            </div>
        </template>

    </div>

    <!-- VIEW ALL MODAL -->
    <template if:true={isModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open slds-modal_large"
        >
            <div class="slds-modal__container"
                 style="width: 95vw; max-width: 95vw;">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        All Order Lines ({totalCount})
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-scrollable_x slds-scrollable_y"
                         style="height: 70vh;">
                        <lightning-datatable
                            key-field="Id"
                            data={allOrderLines}
                            columns={columns}
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            onsort={handleSort}
                            hide-checkbox-column
                            show-row-number-column>
                        </lightning-datatable>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
