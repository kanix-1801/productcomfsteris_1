<template>
    <lightning-card title="Contacts" icon-name="standard:contact">
        <div slot="actions">
            <lightning-button label="New" onclick={handleNewContact}></lightning-button>
        </div>

        <template if:true={hasRecords}>
            <lightning-datatable
                key-field="id"
                data={visibleContacts}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column>
            </lightning-datatable>

            <template if:true={hasMoreRecords}>
                <div class="slds-align_absolute-center slds-p-around_small">
                    <lightning-button
                        variant="base"
                        label={showMoreLabel}
                        onclick={handleShowMore}>
                    </lightning-button>
                </div>
            </template>
        </template>

        <template if:false={hasRecords}>
            <div class="slds-p-around_medium">
                No Contacts Found
            </div>
        </template>
    </lightning-card>
</template>
