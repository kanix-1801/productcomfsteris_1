<template>
    <lightning-card>
        <template if:true={canCreateRelationship}>
            <div slot="actions">
                <template if:false={showFlow}>
                    <lightning-button
                        label="New"
                        variant="brand"
                        onclick={handleNewRelationship}>
                    </lightning-button>
                </template>
                <template if:true={showFlow}>
                    <lightning-button
                        label="Close"
                        onclick={handleCloseFlow}>
                    </lightning-button>
                </template>
            </div>
        </template>

        <template if:true={showFlow}>
            <div class="slds-p-around_medium">
                <lightning-flow
                    flow-api-name="Account_SCR_Create_IDN_GPO_Relationship"
                    flow-input-variables={flowInputs}
                    onstatuschange={handleFlowStatusChange}>
                </lightning-flow>
            </div>
        </template>

        <div class="slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading Account Account Relationships" size="medium"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasRecords}>
                    <lightning-datatable
                        key-field="id"
                        data={records}
                        columns={columns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column>
                    </lightning-datatable>
                </template>

                <template if:false={hasRecords}>
                    <div class="slds-p-around_medium slds-text-color_weak">
                        No Account-Account Relationships Found
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
