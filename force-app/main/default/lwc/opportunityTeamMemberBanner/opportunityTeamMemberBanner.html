<!--
    @author Sahithi
    @date 04-11-2026
    @description 3658 - Warning banner for an Instrument Processing Opportunity.
                 Shows when Sales Operations / Contracting team members were not added
                 and Opportunity_Team_Member_Count__c is 0.
-->
<template>
    <template lwc:if={isVisible}>
        <div class="slds-notify slds-notify_alert banner-container banner-warning" role="alert">
            <span class="slds-assistive-text">{bannerMessage}</span>
            <div class="banner-content">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning"
                    size="small"
                    class="banner-icon"
                ></lightning-icon>
                <div class="banner-text">
                    <p class="banner-message">{bannerMessage}</p>
                </div>
            </div>
        </div>
    </template>
</template>
