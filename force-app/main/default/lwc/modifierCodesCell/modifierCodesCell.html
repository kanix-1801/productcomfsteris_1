<template>
    <div class="modifier-cell">
        <template lwc:if={showValue}>
            <span class="modifier-name">{row.modifierName}</span>
            <template lwc:if={showEdit}>
                <button
                    type="button"
                    class="icon-button"
                    onclick={handleEdit}
                    title="Edit modifier"
                    aria-label="Edit modifier"
                >
                    <lightning-icon icon-name="utility:edit" size="x-small" alternative-text=""></lightning-icon>
                </button>
            </template>
            <button
                type="button"
                class="icon-button"
                onclick={handleRemove}
                title="Remove modifier"
                aria-label="Remove modifier"
            >
                <lightning-icon icon-name="utility:delete" size="x-small" alternative-text=""></lightning-icon>
            </button>
        </template>
        <template lwc:elseif={showAdd}>
            <button type="button" class="add-button" onclick={handleAdd} title="Add modifier" aria-label="Add modifier">
                +
            </button>
        </template>
    </div>
</template>
