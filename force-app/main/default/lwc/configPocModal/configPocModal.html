<template>
    <lightning-modal-header label="Edit configuration values"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-input type="number" label="Quantity" value={draftQuantity} onchange={handleQuantity}></lightning-input>
        <lightning-input type="text" label="Asset Name" value={draftAssetName} onchange={handleAssetName} class="slds-m-top_small"></lightning-input>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button variant="brand" label="Save" class="slds-m-left_x-small" onclick={handleSave}></lightning-button>
    </lightning-modal-footer>
</template>
