<template>
    <lightning-card title="Consolidate Vendor Shipment" icon-name="standard:shipment">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={handleRefresh}
                disabled={isRefreshDisabled}
            ></lightning-button-icon>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={isSelectPage}>
            <div class="slds-p-around_medium">
                <template lwc:if={errorMessage}>
                    <div class="slds-box slds-theme_error slds-m-bottom_medium" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <template lwc:if={infoMessage}>
                    <div class="slds-box slds-theme_info slds-m-bottom_medium" role="status">
                        {infoMessage}
                    </div>
                </template>

                <div class="slds-m-bottom_small slds-text-body_small">
                    Repair Center: {repairCenterName}
                </div>

                <div class="scan-field slds-m-bottom_medium">
                    <lightning-input
                        data-id="scan-work-order"
                        type="text"
                        label="Scan Work Order"
                        value={scanValue}
                        placeholder="Scan or enter Work Order Number / Id"
                        onchange={handleScanChange}
                        onkeydown={handleScanKeyDown}
                        disabled={isBusy}
                    ></lightning-input>
                </div>

                <div class="table-container slds-m-bottom_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="checkbox-column">
                                    <lightning-input
                                        type="checkbox"
                                        label="Select All"
                                        variant="label-hidden"
                                        checked={selectAllChecked}
                                        onchange={handleSelectAllChange}
                                        disabled={isBusy}
                                    ></lightning-input>
                                </th>
                                <th scope="col">Work Order Number</th>
                                <th scope="col">Parent Work Order</th>
                                <th scope="col">Status</th>
                                <th scope="col">Sub Status</th>
                                <th scope="col">Vendor</th>
                                <th scope="col" class="vendor-address-column">Vendor Address</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template lwc:if={hasTableRows}>
                                <template for:each={tableRows} for:item="row">
                                    <tr key={row.key} class={row.rowClass}>
                                        <template lwc:if={row.isGroupHeader}>
                                            <td colspan="7">{row.vendorName}</td>
                                        </template>
                                        <template lwc:else>
                                            <td class="checkbox-column">
                                                <lightning-input
                                                    type="checkbox"
                                                    variant="label-hidden"
                                                    data-id={row.id}
                                                    checked={row.selected}
                                                    onchange={handleRowSelectionChange}
                                                    disabled={isBusy}
                                                    label={row.workOrderNumber}
                                                ></lightning-input>
                                            </td>
                                            <td>{row.workOrderNumber}</td>
                                            <td>{row.parentWorkOrderNumber}</td>
                                            <td>{row.status}</td>
                                            <td>{row.subStatus}</td>
                                            <td>{row.vendorName}</td>
                                            <td class="vendor-address-column">{row.vendorAddress}</td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                            <template lwc:else>
                                <tr>
                                    <td colspan="7" class="slds-text-align_center slds-p-around_medium">
                                        No Outside Vendor work orders found for your Repair Center.
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="footer-actions">
                    <span class="selection-count slds-text-body_small">
                        {selectedCount} selected
                    </span>
                    <lightning-button
                        variant="brand"
                        label="Next"
                        onclick={handleNext}
                        disabled={isNextDisabled}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:elseif={isSummaryPage}>
            <div class="slds-p-around_medium">
                <template lwc:if={errorMessage}>
                    <div class="slds-box slds-theme_error slds-m-bottom_medium" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <div class="slds-text-heading_small slds-m-bottom_small">Summary</div>
                <p class="slds-m-bottom_medium slds-text-body_small">
                    Review selected work orders. Uncheck or remove items before completing.
                </p>

                <div class="table-container slds-m-bottom_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="checkbox-column">
                                    <lightning-input
                                        type="checkbox"
                                        label="Select All"
                                        variant="label-hidden"
                                        checked={summarySelectAllChecked}
                                        onchange={handleSummarySelectAllChange}
                                        disabled={isBusy}
                                    ></lightning-input>
                                </th>
                                <th scope="col">Work Order Number</th>
                                <th scope="col">Parent Work Order</th>
                                <th scope="col">Status</th>
                                <th scope="col">Sub Status</th>
                                <th scope="col">Vendor</th>
                                <th scope="col" class="vendor-address-column">Vendor Address</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={summaryRows} for:item="row">
                                <tr key={row.id}>
                                    <td class="checkbox-column">
                                        <lightning-input
                                            type="checkbox"
                                            variant="label-hidden"
                                            data-id={row.id}
                                            checked={row.summarySelected}
                                            onchange={handleSummaryRowSelectionChange}
                                            disabled={isBusy}
                                            label={row.workOrderNumber}
                                        ></lightning-input>
                                    </td>
                                    <td>{row.workOrderNumber}</td>
                                    <td>{row.parentWorkOrderNumber}</td>
                                    <td>{row.status}</td>
                                    <td>{row.subStatus}</td>
                                    <td>{row.vendorName}</td>
                                    <td class="vendor-address-column">{row.vendorAddress}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="summary-actions">
                    <lightning-button
                        label="Remove Selected"
                        onclick={handleRemoveSelected}
                        disabled={isRemoveDisabled}
                    ></lightning-button>
                    <div class="summary-actions__right">
                        <lightning-button
                            label="Add Additional Work Orders"
                            onclick={handleAddAdditional}
                            disabled={isBusy}
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Complete"
                            onclick={handleComplete}
                            disabled={isCompleteDisabled}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
